<title>The 2026 Nonfiction Hotlist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&family=Roboto+Serif:ital,opsz,wght@0,8..144,400;0,8..144,500;0,8..144,600;1,8..144,400;1,8..144,600&display=swap">
<style>
/* The list, in the Nonfiction Hotlist design (build brief, November 2026): the same type, colors, buttons and
   cards as nonfictionhotlist.com. On the website the brand kit (/brand/v1/nfh.css) also loads, with the
   shared top bar and footer; the tokens below repeat its values so the Claude artifact version looks the same.
   Cover: black, outlined year, edition label, big lowercase headline. Grid: poster cards that fill green on
   hover. Project: the still under the green overlay, then the logline and details. */
:root {
  --white: #ffffff; --paper: #f2f2f2; --black: #000000;
  --green: #588257; --green-glow: #5c965e; --green-shade: #45684d;
  --forest: #3a5a40; --pine: #324d3f; --pine-deep: #1a2821;
  --spark: #fcb100; --rule: #d5ddd6; --rule-dark: #3f5a4b;
  --sage: #c9d6cb; --green-label: #8fbf90; --mint: #c9e3ca; --muted: #4d5a50;
  --gradient-green: linear-gradient(135deg, #5c965e 0%, #45684d 100%);
  --gradient-green-text: linear-gradient(135deg, #588257 0%, #3a5a40 100%);
  --gradient-forest: linear-gradient(135deg, #1a2821 0%, #324d3f 100%);
  --photo-overlay: linear-gradient(135deg, rgba(92,150,94,.88) 0%, rgba(69,104,77,.92) 60%, rgba(26,40,33,.95) 100%);
  --font-display: "League Spartan", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Roboto Serif", Georgia, serif;
  --display: var(--font-display); --body: var(--font-body);
  --max: 1440px; --gutter: clamp(16px, 5vw, 64px);
  --radius-sm: 6px; --radius-md: 14px; --radius-pill: 9999px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--white); }
body { margin: 0; background: var(--white); color: var(--black); font-family: var(--font-body); font-size: 17px; line-height: 27px; -webkit-font-smoothing: antialiased; }
a { color: var(--forest); }
a:hover { color: var(--pine-deep); }
:focus-visible { outline: 3px solid var(--forest); outline-offset: 3px; }
.dark :focus-visible { outline-color: var(--spark); }
.gutter { padding-left: var(--gutter); padding-right: var(--gutter); }
.wrap { max-width: var(--max); margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }
.label { font: 700 14px/18px var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); }
.dark .label { color: var(--green-label); }
.h { font-family: var(--font-display); font-weight: 700; text-transform: lowercase; letter-spacing: -0.03em; line-height: .92; margin: 0; }

/* Buttons: 6px corners, lowercase League Spartan, at least 44px */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 2px solid currentColor; border-radius: var(--radius-sm);
  background: transparent; color: var(--black); font: 700 16px/1 var(--font-display); text-transform: lowercase; text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: background-color .2s, color .2s, border-color .2s; }
.btn:hover { background: var(--black); color: var(--white); border-color: var(--black); }
.btn.solid { background: var(--forest); color: var(--white); border-color: var(--forest); }
.btn.solid:hover { background: var(--pine-deep); border-color: var(--pine-deep); }
.dark .btn { color: var(--white); }
.dark .btn:hover { background: var(--white); color: var(--black); border-color: var(--white); }
.dark .btn.solid { background: var(--white); color: var(--black); border-color: var(--white); }
.dark .btn.solid:hover { background: var(--sage); border-color: var(--sage); }
.btn.big { min-height: 52px; padding: 0 26px; font-size: 18px; }
.icon-btn { width: 44px; padding: 0; font-size: 18px; }
.icon-btn[aria-disabled="true"] { opacity: .3; pointer-events: none; }

/* The list's own bar: its controls (under the website's top bar on the website) */
.bar { position: sticky; top: 0; z-index: 5; background: var(--white); border-bottom: 1px solid var(--rule); }
.bar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 10px; max-width: var(--max); margin: 0 auto; }
.wordmark { font: 700 20px/1 var(--font-display); letter-spacing: -0.01em; text-transform: lowercase; color: var(--black); text-decoration: none; white-space: nowrap; }
.wordmark span { color: var(--forest); margin-left: 6px; }
.bar-nav { display: flex; align-items: center; gap: 8px; }
.counter { font: 700 14px/1 var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); min-width: 4.5em; text-align: center; font-variant-numeric: tabular-nums; }
.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--black); color: var(--white); font: 700 16px/1.2 var(--font-display); padding: 12px 18px; border-radius: var(--radius-sm); max-width: calc(100% - 32px); }
@media (max-width: 560px) { #pdfBtn { padding: 0 12px; } .bar-nav { gap: 6px; } #prevBtn, #nextBtn { display: none; } }

/* Index drawer */
.index-panel { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .45); display: flex; justify-content: flex-end; }
.index-sheet { width: min(420px, 100%); height: 100%; overflow-y: auto; background: var(--white);
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 28px; }
.index-sheet h2 { font: 700 44px/1 var(--font-display); letter-spacing: -0.02em; text-transform: lowercase; margin: 0 0 16px; }
.index-sheet ol { list-style: none; margin: 0; padding: 0; display: grid; }
.index-sheet a { display: flex; gap: 12px; align-items: baseline; min-height: 44px; padding: 10px 0; text-decoration: none; color: var(--black); border-bottom: 1px solid var(--rule);
  font: italic 600 18px/1.25 var(--font-body); }
.index-sheet a:hover { color: var(--forest); }
.index-sheet .n { font: 700 14px/1 var(--font-display); font-style: normal; letter-spacing: .12em; color: var(--forest); width: 2.2ch; font-variant-numeric: tabular-nums; }
.index-head { display: flex; justify-content: space-between; align-items: flex-start; }

main { padding-bottom: 0; }

/* Cover: black, the outlined year behind, edition label, big lowercase headline */
.cover { position: relative; overflow: hidden; background: var(--black); color: var(--white); }
.cover-year { position: absolute; right: -2vw; top: -4vw; font: 700 clamp(240px, 38vw, 560px)/.8 var(--font-display); letter-spacing: -0.05em;
  color: transparent; -webkit-text-stroke: 2px var(--year-stroke, var(--green)); pointer-events: none; user-select: none; }
.cover-year.y2025 { --year-stroke: var(--white); }   /* 2025 white, later years green; the year sits up top on every edition */
.cover-in { position: relative; display: flex; flex-direction: column; gap: 28px; padding-block: clamp(72px, 9vw, 128px) clamp(64px, 7vw, 104px); }
.cover h1 { font: 700 clamp(60px, 9vw, 140px)/.88 var(--font-display); letter-spacing: -0.035em; text-transform: lowercase; margin: 0; max-width: 1000px; }
.cover-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px 48px; flex-wrap: wrap; }
.cover p.lede { max-width: 640px; font-size: clamp(20px, 2vw, 24px); line-height: 1.4; margin: 0; }
.cover-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.cover-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.cover-strip a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: var(--radius-pill); border: 1.5px solid #333333; color: var(--muted-on-black, #cfcfcf);
  font: italic 600 14px/1.2 var(--font-body); text-decoration: none; }
.cover-strip a:hover { border-color: var(--white); color: var(--white); }

/* Welcome */
.mosaic { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: clamp(32px, 4vw, 56px); }
.mosaic a { aspect-ratio: 3 / 2; overflow: hidden; border-radius: 8px; display: block; background: var(--pine-deep); position: relative; }
.mosaic a::after { content: ""; position: absolute; inset: 0; background: var(--pine-deep); transform-origin: right center; pointer-events: none; }
.mosaic a.v::after { transform-origin: center top; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; }
.mosaic a.in img { opacity: 1; animation: tile-settle 1.6s cubic-bezier(0.16, 1, 0.3, 1); }
.mosaic a.in::after { transform: scaleX(0); animation: tile-wipe 0.9s cubic-bezier(0.76, 0, 0.24, 1); }
.mosaic a.in.v::after { transform: scaleY(0); animation-name: tile-wipe-v; }
@keyframes tile-wipe { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes tile-wipe-v { from { transform: scaleY(1); } to { transform: scaleY(0); } }
@keyframes tile-settle { from { transform: scale(1.28); } to { transform: scale(1); } }
.mosaic a:hover img { transform: scale(1.04); transition: transform .4s ease; }
@media (prefers-reduced-motion: reduce) { .mosaic img { opacity: 1; animation: none !important; } .mosaic a::after { display: none; } }
/* **highlights** in the text: a soft green marker */
.hi { background: linear-gradient(transparent 55%, rgba(92, 150, 94, .32) 55%, rgba(92, 150, 94, .32) 92%, transparent 92%); padding: 0 .06em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.dark .hi { background: linear-gradient(transparent 55%, rgba(255, 255, 255, .22) 55%, rgba(255, 255, 255, .22) 92%, transparent 92%); }
.hi .num { font-family: var(--font-display); font-weight: 700; }
.w-intro, .why-top { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 32px clamp(32px, 6vw, 96px); padding-block: clamp(56px, 7vw, 104px) 0; align-items: start; }
.w-intro h2, .why-top h2 { font: 700 clamp(48px, 5.6vw, 84px)/.92 var(--font-display); letter-spacing: -0.03em; text-transform: lowercase; color: var(--forest); margin: 0; }
.w-lede p { font-size: 21px; line-height: 1.5; font-weight: 500; margin: 0 0 .7em; }
.w-lede p:last-child { color: var(--forest); font-weight: 400; font-size: 19px; }
.why-top p { margin: 0 0 1em; max-width: 36em; }
.why-top p:first-child { font-size: 21px; line-height: 1.5; font-weight: 500; }
/* Green panels: square color blocks, white text */
.panel-dark, .select { background: var(--gradient-green-text); color: var(--white); padding: clamp(32px, 4vw, 56px); }
.w-row { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px clamp(32px, 6vw, 96px); margin-top: clamp(48px, 6vw, 80px); }
.w-label { font: 700 14px/18px var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); padding-top: 4px; }
.panel-dark .w-label, .select .w-label { color: var(--mint); }
.w-row p { margin: 0 0 .8em; max-width: 36em; font-size: 19px; line-height: 30px; }
.w-row p:last-child { margin: 0; }
.w-next { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; padding-bottom: clamp(56px, 7vw, 104px); flex-wrap: wrap; }
.select { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px clamp(32px, 6vw, 96px); margin-top: clamp(40px, 5vw, 64px); }
.select .big { font: 700 clamp(56px, 7vw, 108px)/.86 var(--font-display); letter-spacing: -0.04em; }
.select .big small { display: block; font: 700 14px/1.4 var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--mint); margin-top: 16px; }
.criteria { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.criteria li { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: var(--radius-pill); border: 1.5px solid var(--white); font: 700 16px/1.1 var(--font-display); text-transform: lowercase; }
.select p { margin: 0; font-size: 17px; line-height: 27px; }
.steps { list-style: none; margin: 20px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.steps li { padding: 24px; display: grid; gap: 10px; align-content: start; border: 1px solid var(--rule); border-radius: var(--radius-md); }
.steps .k { font: 700 14px/1 var(--font-display); letter-spacing: .12em; color: var(--forest); font-variant-numeric: tabular-nums; }
.steps b { font: 700 24px/1.05 var(--font-display); letter-spacing: -0.01em; text-transform: lowercase; }
.steps span { font-size: 16px; line-height: 25px; }
.close-line { font: 700 clamp(28px, 3vw, 44px)/1.08 var(--font-display); letter-spacing: -0.02em; text-transform: lowercase; color: var(--forest); max-width: 24em; margin: clamp(48px, 6vw, 80px) 0 0; }
.prose p { margin: 0 0 1em; }

/* Grid pages */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-block: clamp(48px, 6vw, 88px) 32px; }
.page-head h2 { font: 700 clamp(48px, 5.6vw, 84px)/.92 var(--font-display); letter-spacing: -0.03em; text-transform: lowercase; margin: 0; }
.page-head .range { display: block; margin-top: 12px; font: 700 14px/18px var(--font-display); letter-spacing: .12em; color: var(--forest); font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 8px; flex-wrap: wrap; }
.dots a { min-width: 44px; height: 44px; padding: 0 12px; border-radius: var(--radius-pill); display: grid; place-items: center; border: 1.5px solid var(--forest); color: var(--forest);
  font: 700 16px/1 var(--font-display); text-decoration: none; font-variant-numeric: tabular-nums; }
.dots a:hover { background: var(--forest); color: var(--white); }
.dots a[aria-current="page"] { background: var(--forest); color: var(--white); }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
/* Poster cards: 14px corners, italic titles, format pill; they fill green on hover (as the homepage's cards do) */
.card { display: flex; flex-direction: column; gap: 12px; padding: 12px 12px 22px; min-width: 0; border: 1px solid var(--rule); border-radius: var(--radius-md); color: var(--black); text-decoration: none;
  transition: background-color .25s, color .25s, border-color .25s; }
.card > :not(.poster) { margin-left: 8px; margin-right: 8px; }
.card .meta { align-self: flex-start; display: inline-flex; padding: 4px 12px; border-radius: var(--radius-pill); border: 1.5px solid var(--forest); color: var(--forest); font: 700 13px/18px var(--font-display); text-transform: lowercase; }
.card h3 { font: italic 600 21px/1.2 var(--font-body); margin: 0; }
.card p { margin: 0; font-size: 16px; line-height: 25px; }
.card:hover, .card:focus-visible { background: var(--gradient-green-text); color: var(--white); border-color: transparent; }
.card:hover .meta, .card:focus-visible .meta { border-color: var(--white); color: var(--white); }
.card:hover .accolade, .card:hover .accolade b { color: var(--white); }

/* Poster: the key image, or a typographic fallback */
.poster { aspect-ratio: 3 / 2; width: 100%; border-radius: 8px; overflow: hidden; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster.t0 { background: var(--gradient-forest); color: var(--white); }
.poster.t1 { background: var(--gradient-green-text); color: var(--white); }
.poster.t2 { background: var(--black); color: var(--white); }
.poster .p-title { font: 700 clamp(19px, 1.2vw + 10px, 26px)/.92 var(--font-display); letter-spacing: -0.02em; text-transform: lowercase; }
.poster .p-foot { display: flex; justify-content: space-between; font: 700 12px/1 var(--font-display); letter-spacing: .12em; text-transform: lowercase; opacity: .8; }

/* Project page: the still under the green overlay, the title on it */
.p-hero { position: relative; isolation: isolate; color: var(--white); background: var(--pine-deep); overflow: hidden; }
.p-hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.p-hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--photo-overlay); }
.p-hero .wrap { min-height: clamp(380px, 40vw, 560px); display: flex; flex-direction: column; justify-content: space-between; gap: 32px; padding-block: 28px clamp(40px, 5vw, 72px); }
.p-hero h1 { font: 700 clamp(48px, 6.4vw, 100px)/.9 var(--font-display); letter-spacing: -0.03em; text-transform: lowercase; margin: 0; max-width: 1100px; }
.p-hero .label { color: var(--mint); }
.crumb a { display: inline-flex; align-items: center; min-height: 44px; font: 700 16px/1 var(--font-display); text-transform: lowercase; color: var(--white); text-decoration: none; }
.crumb a:hover { text-decoration: underline; text-underline-offset: 5px; color: var(--white); }
.p-title-block { display: flex; flex-direction: column; gap: 16px; }
.project { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 48px clamp(32px, 6vw, 96px); padding-block: clamp(40px, 5vw, 72px); }
.project aside { display: grid; gap: 16px; align-content: start; position: sticky; top: 84px; align-self: start; }
.facts { display: grid; gap: 18px; margin: 0; }
.facts div { display: grid; gap: 6px; }
.facts dt { font: 700 14px/18px var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); }
.facts dd { margin: 0; overflow-wrap: anywhere; font-size: 16px; line-height: 24px; }
.copy-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy-row code { font-family: var(--font-body); user-select: all; overflow-wrap: anywhere; }
.copy-btn { min-height: 36px; padding: 0 12px; font-size: 14px; border-width: 1.5px; }
.logline { font-size: clamp(21px, 2vw, 26px); line-height: 1.35; margin: 0 0 28px; max-width: 30em; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin-bottom: 28px; overflow-x: auto; }
.tabs a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 14px; font: 700 17px/1 var(--font-display); text-transform: lowercase; text-decoration: none; color: var(--muted);
  border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a[aria-current="true"] { color: var(--black); border-bottom-color: var(--forest); }
.tabs a:hover { color: var(--forest); }
.tabs .count { display: inline-grid; place-items: center; min-width: 1.5em; height: 1.5em; margin-left: 6px; border-radius: var(--radius-pill); background: var(--forest); color: var(--white); font-size: .75em; font-variant-numeric: tabular-nums; }
.panel { max-width: 46em; }
.panel h4 { font: 700 14px/18px var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); margin: 36px 0 14px; }
.panel h4:first-child { margin-top: 0; }
.team { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px 24px; }
.team li { display: grid; gap: 2px; }
.team b { font: 700 20px/1.1 var(--font-display); text-transform: lowercase; letter-spacing: -0.01em; }
.team span { font-size: 15px; line-height: 22px; color: var(--muted); }
/* How to help: forest pills */
.needs { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.needs li { display: inline-flex; align-items: center; padding: 10px 18px; border-radius: 24px; background: var(--forest); color: var(--white); font-size: 16px; line-height: 22px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.note { color: var(--muted); font-size: 15px; }
.updates { list-style: none; padding: 0; margin: 0; }
.updates li { padding: 16px 0; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 8em minmax(0, 1fr); gap: 16px; }
.updates li:first-child { border-top: 0; padding-top: 0; }
.updates time { font: 700 14px/18px var(--font-display); letter-spacing: .08em; text-transform: lowercase; color: var(--forest); padding-top: 4px; }
.updates li > div { display: grid; gap: 4px; }
.empty { border: 1px solid var(--rule); border-radius: var(--radius-md); padding: 20px; color: var(--muted); font-size: 16px; }
.stills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stills.one { grid-template-columns: minmax(0, 1fr); }
.stills button { padding: 0; border: 0; background: var(--pine-deep); cursor: zoom-in; border-radius: var(--radius-md); overflow: hidden; display: block; }
.stills img { display: block; width: 100%; height: 100%; object-fit: cover; aspect-ratio: 3 / 2; transition: transform .4s ease; }
.stills button:hover img { transform: scale(1.03); }
.stills.three button:first-child { grid-column: 1 / -1; }
.stills.three button:first-child img { aspect-ratio: 16 / 9; }
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .94); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: var(--radius-md); }
.lightbox .btn { position: absolute; top: 14px; right: 14px; color: var(--white); }
/* Laurels and news */
.laurels { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 0 0 26px; padding: 0; list-style: none; }
.laurel { display: grid; grid-template-columns: 22px auto 22px; align-items: center; gap: 4px; color: var(--forest); }
.laurel svg { width: 22px; height: 52px; display: block; }
.laurel svg.r { transform: scaleX(-1); }
.laurel div { display: grid; justify-items: center; text-align: center; line-height: 1.1; max-width: 13.5em; }
.laurel small { font: 700 11px/1.2 var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); }
.laurel b { font: 700 15px/1.15 var(--font-display); color: var(--black); margin-top: 3px; text-transform: lowercase; }
.laurel span { font: 700 12px/1 var(--font-display); color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }

/* Staggered reveal for the welcome mosaic. Fixed, scattered order so some tiles land early. */
const MOSAIC_BEATS = [0, 420, 140, 700, 260, 980, 560, 60, 840, 330, 1120, 200, 900, 480, 640, 1040, 280, 760];
function revealMosaic() {
  const start = performance.now();
  document.querySelectorAll(".mosaic img").forEach((img, i) => {
    const beat = MOSAIC_BEATS[i % MOSAIC_BEATS.length];
    const tile = img.parentElement;
    if (i % 3 === 1) tile.classList.add("v");
    const show = () => setTimeout(() => tile.classList.add("in"), Math.max(0, beat - (performance.now() - start)));
    if (img.complete && img.naturalWidth) show();
    else { img.addEventListener("load", show, { once: true }); img.addEventListener("error", () => tile.classList.add("in"), { once: true }); }
  });
}

/* A laurel branch: paired leaves along a curved stem. Mirrored for the right side. */
const BRANCH = (() => {
  const out = [];
  const leaf = (x, y, rot, rx = 2.4, ry = 5.6) => out.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${rx}" ry="${ry}" transform="rotate(${rot.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`);
  const N = 6;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const x = 14 - Math.sin(t * Math.PI * 0.85) * 7, y = 55 - t * 46;
    const tilt = (t - 0.5) * 30;
    leaf(x - 3.6, y - 2.5, -38 + tilt);
    leaf(x + 2.6, y - 3.2, 28 + tilt, 2.1, 5);
  }
  leaf(12.6, 5.5, 8, 2.2, 5);
  const stem = `<path d="M15 58 C 8 46, 6 26, 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>`;
  return stem + `<g fill="currentColor">${out.join("")}</g>`;
})();
const branch = (cls = "") => `<svg class="${cls}" viewBox="0 0 22 60" aria-hidden="true">${BRANCH}</svg>`;

}

  return `<section class="p-hero dark">${still}
    <div class="wrap">

      <div class="p-title-block"><p class="label">${esc(p.format)} &middot; ${pad(idx + 1)} of ${PROJECTS.length}</p><h1>${esc(p.title)}</h1></div>
    </div>

        <p class="logline">${esc(p.logline)}</p>
        ${laurelsHTML(p.laurels)}

        </dl>
      </aside>
    </article>
    <div class="pager">
      ${prev ? `<a class="btn" href="#${prev.slug}">&larr; ${esc(prev.title)}</a>` : `<span></span>`}
      ${next ? `<a class="btn" href="#${next.slug}">${esc(next.title)} &rarr;</a>` : `<a class="btn" href="#page-${PAGES}">Back to projects</a>`}
    </div>
  </div>`;
}

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const counter = document.getElementById("counter");

function setNav(prev, next, label) {
  [[prevBtn, prev], [nextBtn, next]].forEach(([b, h]) => {
    if (h) { b.href = h; b.removeAttribute("aria-disabled"); } else { b.href = "#"; b.setAttribute("aria-disabled", "true"); }
  });
  counter.textContent = label;
}

/* Visit counting. The website defines window.nfhTrack (GoatCounter); in the Claude version it doesn't
   exist and nothing is counted. A project counts once per visit, not per tab. */
let lastCounted = null;
function countView(path, title) {
  if (path === lastCounted) return;
  lastCounted = path;
  if (window.nfhTrack) window.nfhTrack(path, title);
}

function route() {
  const raw = (location.hash || "#cover").slice(1);
  const [key, tab = ""] = raw.split(".");
  const projIdx = PROJECTS.findIndex(p => p.slug === key);
  if (projIdx > -1) {
    app.innerHTML = renderProject(projIdx, ["help", "links"].includes(tab) ? tab : "");
    setNav(projIdx > 0 ? "#" + PROJECTS[projIdx - 1].slug : null,
           projIdx < PROJECTS.length - 1 ? "#" + PROJECTS[projIdx + 1].slug : null,
           `${pad(projIdx + 1)} / ${PROJECTS.length}`);
    document.title = `${PROJECTS[projIdx].title} · The ${SITE.year} Nonfiction Hotlist`;
    countView("/" + key, PROJECTS[projIdx].title);
  } else {
    let pos = SEQ.indexOf(key);
    if (pos < 0) pos = 0;
    const k = SEQ[pos];
    app.innerHTML = k === "cover" ? renderCover() : k === "welcome" ? renderWelcome() : k === "why" ? renderWhy() : renderGrid(+k.split("-")[1]);
    if (k === "welcome") revealMosaic();
    setNav(pos > 0 ? "#" + SEQ[pos - 1] : null, pos < SEQ.length - 1 ? "#" + SEQ[pos + 1] : null,
           k.startsWith("page-") ? `Page ${k.split("-")[1]} / ${PAGES}` : ({ cover: "Cover", welcome: "Welcome", why: "About" })[k]);
    document.title = `The ${SITE.year} Nonfiction Hotlist`;
    countView(k === "cover" ? "/" : "/" + k, ({ cover: "Cover", welcome: "Welcome", why: "About" })[k] || `Index page ${k.split("-")[1]}`);
  }
  if (!tab) window.scrollTo(0, 0);
}

/* Index drawer */
const panelEl = document.getElementById("indexPanel");
const indexBtn = document.getElementById("indexBtn");
document.getElementById("indexList").innerHTML =
  PROJECTS.map((p, i) => `<li><a href="#${p.slug}"><span class="n">${pad(i + 1)}</span>${esc(p.title)}</a></li>`).join("");
function toggleIndex(open) {
  panelEl.hidden = !open; indexBtn.setAttribute("aria-expanded", String(open));
  if (open) document.getElementById("indexClose").focus();
}
indexBtn.addEventListener("click", () => toggleIndex(panelEl.hidden));
document.getElementById("indexClose").addEventListener("click", () => toggleIndex(false));
panelEl.addEventListener("click", e => { if (e.target === panelEl || e.target.closest("a")) toggleIndex(false); });

/* Copy contact */
app.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const text = b.dataset.copy;
  const done = () => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1600); };
  const fallback = () => {
    const code = b.parentElement.querySelector("code");
    const r = document.createRange(); r.selectNodeContents(code);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    b.textContent = "Selected";
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (_) { fallback(); }
});

/* Stills lightbox */
const lb = document.createElement("div");
lb.className = "lightbox"; lb.hidden = true;
lb.innerHTML = `<img alt=""><button class="btn icon-btn" type="button" aria-label="Close">&times;</button>`;
document.body.appendChild(lb);
lb.addEventListener("click", () => { lb.hidden = true; });
app.addEventListener("click", e => {
  const b = e.target.closest("[data-full]");
  if (!b) return;
  lb.querySelector("img").src = b.dataset.full;
  lb.querySelector("img").alt = b.querySelector("img").alt;
  lb.hidden = false;
});

/* Arrow keys page through the deck */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !lb.hidden) { lb.hidden = true; return; }
  if (e.key === "Escape" && !panelEl.hidden) return toggleIndex(false);
  if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight" && !nextBtn.hasAttribute("aria-disabled")) location.hash = nextBtn.getAttribute("href");
  if (e.key === "ArrowLeft" && !prevBtn.hasAttribute("aria-disabled")) location.hash = prevBtn.getAttribute("href");
});

/* Download PDF: the PDF is built from this same data and published alongside the page. */
const PDF_FILE = "hotlist-" + SITE.year + ".pdf";
let downloads = null, pdfBusy = false;
const toastEl = document.createElement("div");
toastEl.className = "toast"; toastEl.hidden = true; toastEl.setAttribute("role", "status");
document.body.appendChild(toastEl);
function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { toastEl.hidden = true; }, 3200);
}
/* On the public website there is no Claude viewer, so a plain file link does the download. */
const STANDALONE = !(window.claude && window.claude.use);
function showPdfButtons() {
  const on = STANDALONE || !!downloads;
  document.getElementById("pdfBtn").hidden = !on;
  document.querySelectorAll("[data-pdf]").forEach(b => { b.hidden = !on; });
}
function linkDownload() {
  const a = document.createElement("a");
  a.href = PDF_FILE; a.download = `Nonfiction Hotlist ${SITE.year}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
}
async function downloadPdf() {
  if (STANDALONE) return linkDownload();
  if (!downloads || pdfBusy) return;
  pdfBusy = true;
  try {
    const res = await fetch(PDF_FILE);
    if (!res.ok) throw { code: "missing" };
    const blob = await res.blob();
    await downloads.save({ filename: `Nonfiction Hotlist ${SITE.year}.pdf`, data: blob });
  } catch (e) {
    const code = e && e.code;
    if (code === "declined") {}
    else if (code === "rate_limited") toast("A download is already waiting for your OK.");
    else if (code === "missing") toast("The PDF isn't available right now. Try again in a moment.");
    else if (["unavailable", "not_granted", "capability_disabled", "capability_removed", "extension_not_enabled"].includes(code)) {
      toast("Downloads aren't available in this view."); downloads = null; showPdfButtons();
    } else toast("The PDF didn't download. Try again.");
  } finally { pdfBusy = false; }
}
document.addEventListener("click", e => {
  if (!e.target.closest("#pdfBtn, [data-pdf]")) return;
  if (window.nfhTrack) window.nfhTrack("pdf-download", "PDF download", true);
  downloadPdf();
});
showPdfButtons();
(async () => {
  if (STANDALONE) return;
  try { downloads = await window.claude.use("downloads"); } catch (_) { downloads = null; }
  showPdfButtons();
})();

window.addEventListener("hashchange", () => { route(); showPdfButtons(); });
route();
showPdfButtons();
</script>
