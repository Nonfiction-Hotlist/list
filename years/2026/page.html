<title>The 2026 Nonfiction Hotlist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&family=Roboto+Serif:ital,opsz,wght@0,8..144,400;0,8..144,500;0,8..144,600;1,8..144,400;1,8..144,600&display=swap">
<style>
/* The list, in the Nonfiction Hotlist design (build brief, November 2026): the same type, colors, buttons and
   cards as nonfictionhotlist.com. On the website the brand kit (/brand/v1/nfh.css) also loads, with the
   shared top bar and footer; the tokens below repeat its values so the Claude artifact version looks the same.
   Cover: black, outlined year, edition label, big lowercase headline. Grid: poster cards that fill green on
   hover. Project: the still under the green overlay, then the logline and details. */
:root {
  --white: #ffffff; --paper: #f2f2f2; --black: #000000;
  --green: #588257; --green-glow: #5c965e; --green-shade: #45684d;
  --forest: #3a5a40; --pine: #324d3f; --pine-deep: #1a2821;
  --spark: #fcb100; --rule: #d5ddd6; --rule-dark: #3f5a4b;
  --sage: #c9d6cb; --green-label: #8fbf90; --mint: #c9e3ca; --muted: #4d5a50;
  --gradient-green: linear-gradient(135deg, #5c965e 0%, #45684d 100%);
  --gradient-green-text: linear-gradient(135deg, #588257 0%, #3a5a40 100%);
  --gradient-forest: linear-gradient(135deg, #1a2821 0%, #324d3f 100%);
  --photo-overlay: linear-gradient(135deg, rgba(92,150,94,.88) 0%, rgba(69,104,77,.92) 60%, rgba(26,40,33,.95) 100%);
  --font-display: "League Spartan", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Roboto Serif", Georgia, serif;
  --display: var(--font-display); --body: var(--font-body);
  --max: 1440px; --gutter: clamp(16px, 5vw, 64px);
  --radius-sm: 6px; --radius-md: 14px; --radius-pill: 9999px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--white); }
body { margin: 0; background: var(--white); color: var(--black); font-family: var(--font-body); font-size: 17px; line-height: 27px; -webkit-font-smoothing: antialiased; }
a { color: var(--forest); }
a:hover { color: var(--pine-deep); }
:focus-visible { outline: 3px solid var(--forest); outline-offset: 3px; }
.dark :focus-visible { outline-color: var(--spark); }
.gutter { padding-left: var(--gutter); padding-right: var(--gutter); }
.wrap { max-width: var(--max); margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }
.label { font: 700 14px/18px var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); }
.dark .label { color: var(--green-label); }
.h { font-family: var(--font-display); font-weight: 700; text-transform: lowercase; letter-spacing: -0.03em; line-height: .92; margin: 0; }

/* Buttons: 6px corners, lowercase League Spartan, at least 44px */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 2px solid currentColor; border-radius: var(--radius-sm);
  background: transparent; color: var(--black); font: 700 16px/1 var(--font-display); text-transform: lowercase; text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: background-color .2s, color .2s, border-color .2s; }
.btn:hover { background: var(--black); color: var(--white); border-color: var(--black); }
.btn.solid { background: var(--forest); color: var(--white); border-color: var(--forest); }
.btn.solid:hover { background: var(--pine-deep); border-color: var(--pine-deep); }
.dark .btn { color: var(--white); }
.dark .btn:hover { background: var(--white); color: var(--black); border-color: var(--white); }
.dark .btn.solid { background: var(--white); color: var(--black); border-color: var(--white); }
.dark .btn.solid:hover { background: var(--sage); border-color: var(--sage); }
.btn.big { min-height: 52px; padding: 0 26px; font-size: 18px; }
.icon-btn { width: 44px; padding: 0; font-size: 18px; }
.icon-btn[aria-disabled="true"] { opacity: .3; pointer-events: none; }

/* The list's own bar: its controls (under the website's top bar on the website) */
.bar { position: sticky; top: 0; z-index: 5; background: var(--white); border-bottom: 1px solid var(--rule); }
.bar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 10px; max-width: var(--max); margin: 0 auto; }
.wordmark { font: 700 20px/1 var(--font-display); letter-spacing: -0.01em; text-transform: lowercase; color: var(--black); text-decoration: none; white-space: nowrap; }
.wordmark span { color: var(--forest); margin-left: 6px; }
.bar-nav { display: flex; align-items: center; gap: 8px; }
.counter { font: 700 14px/1 var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); min-width: 4.5em; text-align: center; font-variant-numeric: tabular-nums; }
.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--black); color: var(--white); font: 700 16px/1.2 var(--font-display); padding: 12px 18px; border-radius: var(--radius-sm); max-width: calc(100% - 32px); }
@media (max-width: 560px) { #pdfBtn { padding: 0 12px; } .bar-nav { gap: 6px; } #prevBtn, #nextBtn { display: none; } }

/* Index drawer */
.index-panel { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .45); display: flex; justify-content: flex-end; }
.index-sheet { width: min(420px, 100%); height: 100%; overflow-y: auto; background: var(--white);
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 28px; }
.index-sheet h2 { font: 700 44px/1 var(--font-display); letter-spacing: -0.02em; text-transform: lowercase; margin: 0 0 16px; }
.index-sheet ol { list-style: none; margin: 0; padding: 0; display: grid; }
.index-sheet a { display: flex; gap: 12px; align-items: baseline; min-height: 44px; padding: 10px 0; text-decoration: none; color: var(--black); border-bottom: 1px solid var(--rule);
  font: italic 600 18px/1.25 var(--font-body); }
.index-sheet a:hover { color: var(--forest); }
.index-sheet .n { font: 700 14px/1 var(--font-display); font-style: normal; letter-spacing: .12em; color: var(--forest); width: 2.2ch; font-variant-numeric: tabular-nums; }
.index-head { display: flex; justify-content: space-between; align-items: flex-start; }

main { padding-bottom: 0; }

/* Cover: black, the outlined year behind, edition label, big lowercase headline */
.cover { position: relative; overflow: hidden; background: var(--black); color: var(--white); }
.cover-year { position: absolute; right: -2vw; top: -4vw; font: 700 clamp(240px, 38vw, 560px)/.8 var(--font-display); letter-spacing: -0.05em;
  color: transparent; -webkit-text-stroke: 2px var(--year-stroke, var(--green)); pointer-events: none; user-select: none; }
.cover-year.y2025 { --year-stroke: var(--white); }   /* 2025 white, later years green; the year sits up top on every edition */
.cover-in { position: relative; display: flex; flex-direction: column; gap: 28px; padding-block: clamp(72px, 9vw, 128px) clamp(64px, 7vw, 104px); }
.cover h1 { font: 700 clamp(60px, 9vw, 140px)/.88 var(--font-display); letter-spacing: -0.035em; text-transform: lowercase; margin: 0; max-width: 1000px; }
.cover-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px 48px; flex-wrap: wrap; }
.cover p.lede { max-width: 640px; font-size: clamp(20px, 2vw, 24px); line-height: 1.4; margin: 0; }
.cover-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.cover-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.cover-strip a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: var(--radius-pill); border: 1.5px solid #333333; color: var(--muted-on-black, #cfcfcf);
  font: italic 600 14px/1.2 var(--font-body); text-decoration: none; }
.cover-strip a:hover { border-color: var(--white); color: var(--white); }

/* Welcome */
.mosaic { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: clamp(32px, 4vw, 56px); }
.mosaic a { aspect-ratio: 3 / 2; overflow: hidden; border-radius: 8px; display: block; background: var(--pine-deep); position: relative; }
.mosaic a::after { content: ""; position: absolute; inset: 0; background: var(--pine-deep); transform-origin: right center; pointer-events: none; }
.mosaic a.v::after { transform-origin: center top; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; }
.mosaic a.in img { opacity: 1; animation: tile-settle 1.6s cubic-bezier(0.16, 1, 0.3, 1); }
.mosaic a.in::after { transform: scaleX(0); animation: tile-wipe 0.9s cubic-bezier(0.76, 0, 0.24, 1); }
.mosaic a.in.v::after { transform: scaleY(0); animation-name: tile-wipe-v; }
@keyframes tile-wipe { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes tile-wipe-v { from { transform: scaleY(1); } to { transform: scaleY(0); } }
@keyframes tile-settle { from { transform: scale(1.28); } to { transform: scale(1); } }
.mosaic a:hover img { transform: scale(1.04); transition: transform .4s ease; }
@media (prefers-reduced-motion: reduce) { .mosaic img { opacity: 1; animation: none !important; } .mosaic a::after { display: none; } }
/* **highlights** in the text: a soft green marker */
.hi { background: linear-gradient(transparent 55%, rgba(92, 150, 94, .32) 55%, rgba(92, 150, 94, .32) 92%, transparent 92%); padding: 0 .06em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.dark .hi { background: linear-gradient(transparent 55%, rgba(255, 255, 255, .22) 55%, rgba(255, 255, 255, .22) 92%, transparent 92%); }
.hi .num { font-family: var(--font-display); font-weight: 700; }
.w-intro, .why-top { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 32px clamp(32px, 6vw, 96px); padding-block: clamp(56px, 7vw, 104px) 0; align-items: start; }
.w-intro h2, .why-top h2 { font: 700 clamp(48px, 5.6vw, 84px)/.92 var(--font-display); letter-spacing: -0.03em; text-transform: lowercase; color: var(--forest); margin: 0; }
.w-lede p { font-size: 21px; line-height: 1.5; font-weight: 500; margin: 0 0 .7em; }
.w-lede p:last-child { color: var(--forest); font-weight: 400; font-size: 19px; }
.why-top p { margin: 0 0 1em; max-width: 36em; }
.why-top p:first-child { font-size: 21px; line-height: 1.5; font-weight: 500; }
/* Green panels: square color blocks, white text */
.panel-dark, .select { background: var(--gradient-green-text); color: var(--white); padding: clamp(32px, 4vw, 56px); }
.w-row { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px clamp(32px, 6vw, 96px); margin-top: clamp(48px, 6vw, 80px); }
.w-label { font: 700 14px/18px var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); padding-top: 4px; }
.panel-dark .w-label, .select .w-label { color: var(--mint); }
.w-row p { margin: 0 0 .8em; max-width: 36em; font-size: 19px; line-height: 30px; }
.w-row p:last-child { margin: 0; }
.w-next { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; padding-bottom: clamp(56px, 7vw, 104px); flex-wrap: wrap; }
.select { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px clamp(32px, 6vw, 96px); margin-top: clamp(40px, 5vw, 64px); }
.select .big { font: 700 clamp(56px, 7vw, 108px)/.86 var(--font-display); letter-spacing: -0.04em; }
.select .big small { display: block; font: 700 14px/1.4 var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--mint); margin-top: 16px; }
.criteria { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.criteria li { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: var(--radius-pill); border: 1.5px solid var(--white); font: 700 16px/1.1 var(--font-display); text-transform: lowercase; }
.select p { margin: 0; font-size: 17px; line-height: 27px; }
.steps { list-style: none; margin: 20px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.steps li { padding: 24px; display: grid; gap: 10px; align-content: start; border: 1px solid var(--rule); border-radius: var(--radius-md); }
.steps .k { font: 700 14px/1 var(--font-display); letter-spacing: .12em; color: var(--forest); font-variant-numeric: tabular-nums; }
.steps b { font: 700 24px/1.05 var(--font-display); letter-spacing: -0.01em; text-transform: lowercase; }
.steps span { font-size: 16px; line-height: 25px; }
.close-line { font: 700 clamp(28px, 3vw, 44px)/1.08 var(--font-display); letter-spacing: -0.02em; text-transform: lowercase; color: var(--forest); max-width: 24em; margin: clamp(48px, 6vw, 80px) 0 0; }
.prose p { margin: 0 0 1em; }

/* Grid pages */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-block: clamp(48px, 6vw, 88px) 32px; }
.page-head h2 { font: 700 clamp(48px, 5.6vw, 84px)/.92 var(--font-display); letter-spacing: -0.03em; text-transform: lowercase; margin: 0; }
.page-head .range { display: block; margin-top: 12px; font: 700 14px/18px var(--font-display); letter-spacing: .12em; color: var(--forest); font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 8px; flex-wrap: wrap; }
.dots a { min-width: 44px; height: 44px; padding: 0 12px; border-radius: var(--radius-pill); display: grid; place-items: center; border: 1.5px solid var(--forest); color: var(--forest);
  font: 700 16px/1 var(--font-display); text-decoration: none; font-variant-numeric: tabular-nums; }
.dots a:hover { background: var(--forest); color: var(--white); }
.dots a[aria-current="page"] { background: var(--forest); color: var(--white); }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
/* Poster cards: 14px corners, italic titles, format pill; they fill green on hover (as the homepage's cards do) */
.card { display: flex; flex-direction: column; gap: 12px; padding: 12px 12px 22px; min-width: 0; border: 1px solid var(--rule); border-radius: var(--radius-md); color: var(--black); text-decoration: none;
  transition: background-color .25s, color .25s, border-color .25s; }
.card > :not(.poster) { margin-left: 8px; margin-right: 8px; }
.card .meta { align-self: flex-start; display: inline-flex; padding: 4px 12px; border-radius: var(--radius-pill); border: 1.5px solid var(--forest); color: var(--forest); font: 700 13px/18px var(--font-display); text-transform: lowercase; }
.card h3 { font: italic 600 21px/1.2 var(--font-body); margin: 0; }
.card p { margin: 0; font-size: 16px; line-height: 25px; }
.card:hover, .card:focus-visible { background: var(--gradient-green-text); color: var(--white); border-color: transparent; }
.card:hover .meta, .card:focus-visible .meta { border-color: var(--white); color: var(--white); }
.card:hover .accolade, .card:hover .accolade b { color: var(--white); }

/* Poster: the key image, or a typographic fallback */
.poster { aspect-ratio: 3 / 2; width: 100%; border-radius: 8px; overflow: hidden; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster.t0 { background: var(--gradient-forest); color: var(--white); }
.poster.t1 { background: var(--gradient-green-text); color: var(--white); }
.poster.t2 { background: var(--black); color: var(--white); }
.poster .p-title { font: 700 clamp(19px, 1.2vw + 10px, 26px)/.92 var(--font-display); letter-spacing: -0.02em; text-transform: lowercase; }
.poster .p-foot { display: flex; justify-content: space-between; font: 700 12px/1 var(--font-display); letter-spacing: .12em; text-transform: lowercase; opacity: .8; }

/* Project page: the key photo as it is (no overlay), then the label and title on white */
.p-hero { height: clamp(280px, 38vw, 560px); background: var(--pine-deep); overflow: hidden; }
.p-hero > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.p-head { display: flex; flex-direction: column; gap: 14px; padding-top: 20px; }
.p-head h1 { font: 700 clamp(48px, 6.4vw, 100px)/.9 var(--font-display); letter-spacing: -0.03em; text-transform: lowercase; margin: 0; max-width: 1100px; }
.crumb a { display: inline-flex; align-items: center; min-height: 44px; font: 700 16px/1 var(--font-display); text-transform: lowercase; color: var(--forest); text-decoration: none; }
.crumb a:hover { text-decoration: underline; text-underline-offset: 5px; }
.project { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 48px clamp(32px, 6vw, 96px); padding-block: clamp(40px, 5vw, 72px); }
.project aside { display: grid; gap: 16px; align-content: start; position: sticky; top: 84px; align-self: start; }
.project aside .poster { display: block; width: 100%; max-width: 320px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 14px; }
.facts { display: grid; gap: 18px; margin: 0; }
.facts div { display: grid; gap: 6px; }
.facts dt { font: 700 14px/18px var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); }
.facts dd { margin: 0; overflow-wrap: anywhere; font-size: 16px; line-height: 24px; }
.copy-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy-row code { font-family: var(--font-body); user-select: all; overflow-wrap: anywhere; }
.copy-btn { min-height: 36px; padding: 0 12px; font-size: 14px; border-width: 1.5px; }
.logline { font-size: clamp(21px, 2vw, 26px); line-height: 1.35; margin: 0 0 28px; max-width: 30em; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin-bottom: 28px; overflow-x: auto; }
.tabs a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 14px; font: 700 17px/1 var(--font-display); text-transform: lowercase; text-decoration: none; color: var(--muted);
  border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a[aria-current="true"] { color: var(--black); border-bottom-color: var(--forest); }
.tabs a:hover { color: var(--forest); }
.tabs .count { display: inline-grid; place-items: center; min-width: 1.5em; height: 1.5em; margin-left: 6px; border-radius: var(--radius-pill); background: var(--forest); color: var(--white); font-size: .75em; font-variant-numeric: tabular-nums; }
.panel { max-width: 46em; }
.panel h4 { font: 700 14px/18px var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); margin: 36px 0 14px; }
.panel h4:first-child { margin-top: 0; }
.team { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px 24px; }
.team li { display: grid; gap: 2px; }
.team b { font: 700 20px/1.1 var(--font-display); text-transform: lowercase; letter-spacing: -0.01em; }
.team span { font-size: 15px; line-height: 22px; color: var(--muted); }
/* How to help: forest pills */
.needs { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.needs li { display: inline-flex; align-items: center; padding: 10px 18px; border-radius: 24px; background: var(--forest); color: var(--white); font-size: 16px; line-height: 22px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.note { color: var(--muted); font-size: 15px; }
.updates { list-style: none; padding: 0; margin: 0; }
.updates li { padding: 16px 0; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 8em minmax(0, 1fr); gap: 16px; }
.updates li:first-child { border-top: 0; padding-top: 0; }
.updates time { font: 700 14px/18px var(--font-display); letter-spacing: .08em; text-transform: lowercase; color: var(--forest); padding-top: 4px; }
.updates li > div { display: grid; gap: 4px; }
.empty { border: 1px solid var(--rule); border-radius: var(--radius-md); padding: 20px; color: var(--muted); font-size: 16px; }
.stills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stills.one { grid-template-columns: minmax(0, 1fr); }
.stills button { padding: 0; border: 0; background: var(--pine-deep); cursor: zoom-in; border-radius: var(--radius-md); overflow: hidden; display: block; }
.stills img { display: block; width: 100%; height: 100%; object-fit: cover; aspect-ratio: 3 / 2; transition: transform .4s ease; }
.stills button:hover img { transform: scale(1.03); }
.stills.three button:first-child { grid-column: 1 / -1; }
.stills.three button:first-child img { aspect-ratio: 16 / 9; }
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .94); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: var(--radius-md); }
.lightbox .btn { position: absolute; top: 14px; right: 14px; color: var(--white); }
/* Laurels and news */
.laurels { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 0 0 26px; padding: 0; list-style: none; }
.laurel { display: grid; grid-template-columns: 22px auto 22px; align-items: center; gap: 4px; color: var(--forest); }
.laurel svg { width: 22px; height: 52px; display: block; }
.laurel svg.r { transform: scaleX(-1); }
.laurel div { display: grid; justify-items: center; text-align: center; line-height: 1.1; max-width: 13.5em; }
.laurel small { font: 700 11px/1.2 var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); }
.laurel b { font: 700 15px/1.15 var(--font-display); color: var(--black); margin-top: 3px; text-transform: lowercase; }
.laurel span { font: 700 12px/1 var(--font-display); color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }

const PROJECTS = [
{"slug":"my-first-phone","key":"img/my-first-phone-key.jpg","hero":"img/my-first-phone-hero.jpg","focus":50,"focusY":50,"poster":"img/my-first-phone-poster.jpg","gallery":[["img/my-first-phone-g1.jpg",960,640],["img/my-first-phone-g2.jpg",960,640]],"title":"My First Phone","format":"Feature documentary","status":"In the final stages of production, with an editor on board and the film set to finish by the end of 2027.","logline":"Four kids, their first year with a smartphone, told from inside the phones themselves.","summary":"For kids today, the defining coming-of-age milestone is no longer a driver's license. It's a phone. My First Phone follows four kids across the United States before, during and after they get their first smartphones.\n\nWith every family's full consent and a strict set of safeguards, a custom app records each kid's screen and selfie camera for their entire first year. Nothing is opened until the parents have reviewed it. The four families differ in almost every way that matters.","team":[["Zach Wechter","Director and producer"],["Mishka Kornai","Director and producer"],["Zak Piper","Producer"],["Jen Tiexiera","Editor"]],"help":["Investors and grants to close the financing gap","Producers who invest","Sales agents","Impact partners"],"links":[],"onRequest":"","contact":"myfirstphonefilm@gmail.com","laurels":[],"updates":[]},
{"slug":"untitled-paul-robeson","key":"img/untitled-paul-robeson-key.jpg","hero":"img/untitled-paul-robeson-hero.jpg","focus":50,"focusY":50,"poster":"img/untitled-paul-robeson-poster.jpg","gallery":[["img/untitled-paul-robeson-g1.jpg",960,640],["img/untitled-paul-robeson-g2.jpg",960,640]],"title":"Untitled Paul Robeson","format":"Feature documentary","status":"In production. Early sequences cut with editor Rik Chaubet.","logline":"A hybrid portrait of Paul Robeson, the stage and screen star who paid a dear price for his political convictions.","summary":"This film reclaims the legacy of Paul Robeson, rejecting conventional biography for an immersive character study. Drawing on exclusive access to the Robeson estate archive of more than 50,000 artifacts, it centers his own words, images and music.\n\nArchival material blends with newly filmed tableaux that are not reenactments but poetic reflections on his inner life, shaped by the historical, political and psychological realities he lived through. His legacy still fuels global justice movements today.","team":[["Joe Brewster","Director"],["Michèle Stephenson","Director"],["Teddy Leifer","Producer"],["Guy Horlock","Producer"],["Susan Robeson","Producer"],["Rik Chaubet","Editor"],["Bradford Young","Cinematographer"]],"help":[],"links":[],"onRequest":"","contact":"brewster.joe@gmail.com","laurels":[],"updates":[]},
{"slug":"fixers","key":"img/fixers-key.jpg","hero":"img/fixers-hero.jpg","focus":50,"focusY":50,"poster":"img/fixers-poster.jpg","gallery":[["img/fixers-g1.jpg",960,640],["img/fixers-g2.jpg",960,640]],"title":"Fixers","format":"Feature documentary","status":"In production, with post-production to start in November.","logline":"A legendary Mexican fixer brokers cartel access for foreign journalists, and an American filmmaker turns the camera on him.","summary":"Miguel Angel Vega, 54, is a legend among international journalists in Mexico, the go-to fixer for access to organized crime. In a single day he introduces crews to mothers of the disappeared, talks police into letting cameras onto crime scenes and coaxes narcotraffickers into allowing filming inside a fentanyl lab.\n\nWhen French journalists arrive in Culiacán wanting narcos with rifles, Miguel doesn't just secure interviews. He stages reality. A rare and at times darkly funny look at the hidden deal-making behind the stories we see, with implications for the filmmaker's own work.","team":[["Ora DeKornfeld","Director"],["Noah Amir Arjomand","Producer"]],"help":[],"links":[],"onRequest":"","contact":"pdekornfeld@gmail.com","laurels":[],"updates":[]},
{"slug":"j-is-for-jihad","key":"img/j-is-for-jihad-key.jpg","hero":"img/j-is-for-jihad-hero.jpg","focus":50,"focusY":50,"poster":"img/j-is-for-jihad-poster.jpg","gallery":[["img/j-is-for-jihad-g1.jpg",960,640],["img/j-is-for-jihad-g2.jpg",960,640]],"title":"J is for Jihad","format":"Feature documentary","status":"In development.","logline":"People named Jihad in America gather in a meetup group to share their stories in a country they no longer recognize.","summary":"J is for Jihad is a hybrid documentary that reclaims a word flattened in the West into a synonym for terror, by returning it to the people who carry it as a name. Jihad means a righteous struggle: striving to be better, or pursuing justice.\n\nIn small-town California in 1990, Jihad Jaffer's father gives him a used BMW for his sixteenth birthday, with vanity plates reading 4 JIHAD. Gathered in a meetup group, Jihad and others share stories full of humor and complexity that no stereotype can hold.","team":[["Amar Chebib","Director"],["Mustafa Zeno","Producer"]],"help":[],"links":[],"onRequest":"","contact":"amarchebib@gmail.com","laurels":[],"updates":[]},
{"slug":"captains-don-t-cry","key":"img/captains-don-t-cry-key.jpg","hero":"img/captains-don-t-cry-hero.jpg","focus":50,"focusY":50,"poster":"img/captains-don-t-cry-poster.jpg","gallery":[["img/captains-don-t-cry-g1.jpg",960,640],["img/captains-don-t-cry-g2.jpg",960,640]],"title":"Captains Don’t Cry","format":"Feature documentary","status":"In the edit, approaching a fine cut.","logline":"An 85-year-old basketball captain leads her team to the National Senior Games, then is suddenly benched.","summary":"At 85, Sheila Tunstall McKenna doesn't just play basketball. She lives it. For more than 25 years she has been the starting guard of the Connecticut High Fives, a women's team whose players are all in their 80s, with a legacy of competition, friendship and hard-won medals.\n\nWith time closing in, the team sets out for one last run at the National Senior Games. Then Sheila is unexpectedly benched, and the decision lands as more than strategy. For the first time in decades she is off the court, facing questions of identity, purpose and what remains.","team":[["Jenny Schweitzer Bell","Director and producer"],["Brian Bell","Producer"],["Hannah Engleson","Co-cinematographer"]],"help":[],"links":[],"onRequest":"","contact":"jenny.schweitzer.bell@gmail.com","laurels":[],"updates":[]},
{"slug":"our-home-is-not-of-this-world","key":"img/our-home-is-not-of-this-world-key.jpg","hero":"img/our-home-is-not-of-this-world-hero.jpg","focus":50,"focusY":50,"poster":"img/our-home-is-not-of-this-world-poster.jpg","gallery":[["img/our-home-is-not-of-this-world-g1.jpg",960,640],["img/our-home-is-not-of-this-world-g2.jpg",960,640]],"title":"Our Home Is Not Of This World","format":"Feature documentary","status":"In post-production and submitting to festivals.","logline":"A Texas medical examiner who identifies people who die crossing the border wants to retire. No one will replace her.","summary":"Our Home Is Not Of This World follows the unseen work of a medical examiner's office in Texas that identifies people who die crossing the border. Dr. Corinne Stern has done this work for more than 20 years. Border Patrol agents lead her to bodies in the brush, and the phones ring with families searching for missing loved ones.\n\nThe office has never seen this many cases. It is at its breaking point, and so is Dr. Stern, whose plan to retire puts its future in doubt because the county can't find anyone to replace her.","team":[["Russ Finkelstein","Director, producer and editor"],["Manuel Contreras","Producer and editor"],["Elaisha Stokes","Producer and editor"],["Phil Pinto","Producer"],["Alfredo Chiarappa","Cinematographer"]],"help":["A final round of funding for post-production, festivals and release","Introductions to festival programmers","Distribution partners, including alternative distribution","Impact campaign partners","Publicists and media strategy"],"links":[["Donate","https://donate.uniondocs.org/campaigns/our-home-is-not-of-this-world/"],["Instagram","https://www.instagram.com/ourhomeisnotofthisworld/"]],"onRequest":"","contact":"russfinkelstein@gmail.com","laurels":[],"updates":[]},
{"slug":"the-prison-outside","key":"img/the-prison-outside-key.jpg","hero":"img/the-prison-outside-hero.jpg","focus":50,"focusY":50,"poster":"img/the-prison-outside-poster.jpg","gallery":[["img/the-prison-outside-g1.jpg",960,640],["img/the-prison-outside-g2.jpg",960,640]],"title":"The Prison Outside","format":"Feature documentary","status":"In post-production, finishing a rough cut of Act 1, and aiming to finish the film in 2027.","logline":"Terrence Graham won his case at the Supreme Court but came of age behind bars. Now he's out. Is life outside another prison?","summary":"Arrested at 16 and sentenced to life without parole, Terrence Graham fought his way to the Supreme Court and won. Graham v. Florida ruled that children convicted of crimes other than murder could not be sentenced to life without a chance at parole, changing sentencing for young people across the country.\n\nYet as thousands were released on his case, Terrence stayed locked up for 20 more years. In February 2024 he walked out of the Duval County Jail at 37. The film follows what freedom looks like after a childhood spent inside.","team":[["Meg Shutzer","Co-director and producer"],["Brandon Yadegari Moreno","Co-director and DP"],["Rahsaan Thomas","Producer"],["Terrence Graham","Producer and writer"]],"help":["An experienced producer to help with festivals and distribution","A supervising editor","Advice on festival strategy","Color grading, sound design and mixing","Royalty-free music from artists"],"links":[["Donate","https://www.wmm.com/sponsored-project/the-prison-outside/"],["Website","https://grahamvfloridafilm.xyz"],["Instagram","https://www.instagram.com/theprisonoutside/"]],"onRequest":"","contact":"meg@wearefamilypictures.com","laurels":[],"updates":[]},
{"slug":"shiitake","key":"img/shiitake-key.jpg","hero":"img/shiitake-hero.jpg","focus":50,"focusY":50,"poster":"img/shiitake-poster.jpg","gallery":[["img/shiitake-g1.jpg",960,640],["img/shiitake-g2.jpg",960,640]],"title":"Shiitake","format":"Feature documentary","status":"First shoot complete. Fundraising to finish production.","logline":"After nearly dying of cancer, a young woman sets out to learn from Japan's last shiitake masters before their craft disappears.","summary":"In the mountains of Japan, a dwindling community of aging farmers keeps alive a 2,000-year-old tradition: growing shiitake on felled oak logs. The slow, physical work sustains far more than mushrooms. The forests these farmers tend hold hillsides together, catch monsoon rains and feed a cycle of water from mountain canopy to sea.\n\nAs younger generations leave for the cities and the climate shifts, that balance is coming apart. After nearly dying of cancer, a young woman sets out to learn from the last shiitake masters while there is still time.","team":[["Lewis Rapkin","Director and producer"],["Michael Sherman","Executive producer"],["Adam DeMartino","Executive producer"],["Aya Ikeda","Producer"]],"help":[],"links":[],"onRequest":"","contact":"Lewis.Rapkin@oscillatormedia.com","laurels":[],"updates":[]},
{"slug":"a-tender-weapon","key":"img/a-tender-weapon-key.jpg","hero":"img/a-tender-weapon-hero.jpg","focus":50,"focusY":50,"poster":"img/a-tender-weapon-poster.jpg","gallery":[["img/a-tender-weapon-g1.jpg",480,320],["img/a-tender-weapon-g2.jpg",480,320]],"title":"A Tender Weapon","format":"Short documentary","status":"In post-production, raising funds to reach picture lock.","logline":"Cleve Jones turned grief into the AIDS Memorial Quilt. Decades later, he comes out of retirement to organize again.","summary":"In the early years of the AIDS epidemic, people were dying at staggering rates and the federal government largely looked away. Cleve Jones, then in his twenties in San Francisco's Castro, asked what it would take to make the rest of the country care. His answer was the AIDS Memorial Quilt, which turned a generation's grief into political force.\n\nDecades later, as sweeping healthcare cuts threaten millions of Americans, Cleve comes out of retirement to build a new movement, asking whether collective pain can still move a country to act.","team":[["Matt Nadel","Co-director and producer"],["Miranda Divozzo","Co-director"],["Gus Van Sant","Executive producer"],["Luke Hodges","Producer"],["Alex Bohs","Editor"]],"help":[],"links":[],"onRequest":"","contact":"mattsnadel@gmail.com","laurels":[],"updates":[]},
{"slug":"the-dead-zone","key":"img/the-dead-zone-key.jpg","hero":"img/the-dead-zone-hero.jpg","focus":50,"focusY":50,"poster":"img/the-dead-zone-poster.jpg","gallery":[["img/the-dead-zone-g1.jpg",480,320],["img/the-dead-zone-g2.jpg",480,320]],"title":"The Dead Zone","format":"Feature documentary","status":"In post-production, raising the last $50,000 to finish.","logline":"Four insiders across the South fight to fix pretrial detention, where two people die every day.","summary":"Every day, two people die in pretrial detention, the stretch between arrest and conviction. From the Mississippi Delta to the Kentucky Bluegrass, The Dead Zone brings humanity to one of America's most overlooked crises.\n\nFilmed over four years, it follows four people whose lives meet inside this hidden system: an accused man who waited six years in jail for trial, a public defender, a judge and a district attorney. Together they show how poverty, politics and power collide between arrest and trial, and what reform could look like.","team":[["Emily Thomas","Director, producer and DP"],["Nicole Docta","Producer"],["John Toner","Producer"],["Caroline Kessler","Editor"]],"help":["$50,000 in finishing funds for color, sound mix, music and the online edit","Executive producers, sales agents and distributors","Introductions to festival programmers","Pro bono legal support","Connections to brand partners"],"links":[["Donate","https://www.wmm.com/sponsored-project/the-dead-zone/"],["Website","https://www.deadzonefilm.com"],["Instagram","https://www.instagram.com/Thedeadzonefilm/"]],"onRequest":"","contact":"emily@lemontreeprods.com","laurels":[],"updates":[]},
{"slug":"crystal-city","key":"img/crystal-city-key.jpg","hero":"img/crystal-city-hero.jpg","focus":50,"focusY":50,"poster":"img/crystal-city-poster.jpg","gallery":[["img/crystal-city-g1.jpg",480,320],["img/crystal-city-g2.jpg",480,320]],"title":"Crystal City","format":"Feature documentary","status":"Early production. Over $200,000 raised in grants, with a rough cut expected in summer 2027.","logline":"Barred from the cheer squad by a racist quota, a Texas teenager sparks a 1969 student walkout that remakes her town's politics.","summary":"It's 1969 in Crystal City, Texas, and sixteen-year-old Diana Palacios, the daughter of migrant farmworkers, just wants to be a cheerleader. Mexican American students make up 85 percent of the school, but an unofficial quota allows only one Chicana on the squad, and Diana is turned away.\n\nHer best friend Severita Lara sees that the squad was never the real problem. The same rules run the whole town. The students write a list of demands, the school board ignores them, and in December 1969 nearly 2,000 students walk out over seventeen days.\n\nA fight over a cheerleading squad becomes a lesson in civic power: who gets heard, who gets counted, and what happens when a community shut out of the process organizes itself.","team":[["Alejandra Vasquez","Co-director and producer"],["Sam Osborn","Co-Director and Editor"],["Bennett Elliott","Producer"],["Cristina Aleman","Archival Producer"]],"help":[],"links":[],"onRequest":"","contact":"alejandra@masa.film","laurels":[],"updates":[]},
{"slug":"hares-on-the-mountain","key":"img/hares-on-the-mountain-key.jpg","hero":"img/hares-on-the-mountain-hero.jpg","focus":50,"focusY":50,"poster":"img/hares-on-the-mountain-poster.jpg","gallery":[["img/hares-on-the-mountain-g1.jpg",960,640],["img/hares-on-the-mountain-g2.jpg",960,640]],"title":"Hares on the Mountain","format":"Feature documentary","status":"Moving from development into production, after three scouting trips.","logline":"As coal fades and tech moves in, a homecoming film asks who decides the future of Appalachia.","summary":"Hares on the Mountain is a personal and social film about the future of the Appalachian coal fields, from the spread of data centers to Indigenous efforts to bring bison back to former mine lands. It spends time with communities living on the coal beds of West Virginia, Kentucky and Virginia.\n\nUnwilling to dismiss the people left behind by extractive industry, the film asks what this region could do if it were allowed self-determination. An environmental allegory about community ties and the mountain as a lasting site of struggle.","team":[["Hadley Austin","Director"],["Dawne Langford","Producer"],["Yoni Goldstein","Director of photography"],["Timothy Fryett","Editor"]],"help":[],"links":[],"onRequest":"","contact":"hadley.austin@proton.me","laurels":[],"updates":[]},
{"slug":"who-goes-fascist","key":"img/who-goes-fascist-key.jpg","hero":"img/who-goes-fascist-hero.jpg","focus":50,"focusY":50,"poster":"img/who-goes-fascist-poster.jpg","gallery":[["img/who-goes-fascist-g1.jpg",960,640],["img/who-goes-fascist-g2.jpg",960,640]],"title":"Who Goes Fascist","format":"Documentary podcast, 6 parts","status":"Characters secured and pre-interviews done. Seeking funding.","logline":"Not whether it could happen here, but whether it could happen to you.","summary":"In April 1967, high school history teacher Ron Jones was asked how ordinary Germans could have let the Holocaust happen. Rather than lecture, he decided to show his students.\n\nHe introduced a movement called The Third Wave, built on discipline, community and action. Within days his students were saluting, reporting on classmates who didn't comply and shutting out anyone who objected. The five-day experiment spiraled beyond anyone's control and left scars that persist nearly sixty years later.","team":[["Jasmyn Morris","Director"],["Nate Tobey","Executive producer and co-host"],["Gretta Cohn","Editorial advisor"]],"help":[],"links":[],"onRequest":"","contact":"jasmyn@hithomemedia.com","laurels":[],"updates":[]},
{"slug":"the-vodou-project","key":"img/the-vodou-project-key.jpg","hero":"img/the-vodou-project-hero.jpg","focus":50,"focusY":50,"poster":"img/the-vodou-project-poster.jpg","gallery":[["img/the-vodou-project-g1.jpg",960,640],["img/the-vodou-project-g2.jpg",480,320]],"title":"The Vodou Project","format":"Documentary podcast, 9 parts","status":"In production. One final reporting trip to Haiti remains.","logline":"A Haitian-American journalist travels the African diaspora to learn why he was taught to fear Vodou.","summary":"The Vodou Project follows Haitian-American journalist Baudelaire Ceus as he investigates the spiritual tradition he grew up fearing. Reporting across Haiti, Benin, Cuba, New Orleans and the wider African diaspora, the series traces Vodou from its West African roots through slavery, the Haitian Revolution and migration.\n\nBaudelaire talks with practitioners, historians and his own family to understand how a tradition that helped enslaved people keep their identity and fight for liberation came to be feared.","team":[["Baudelaire Ceus","Creator, host and executive producer"],["John DeLore","Editor and executive producer"]],"help":[],"links":[],"onRequest":"","contact":"baudelaireceus@gmail.com","laurels":[],"updates":[]},

}

/* **double asterisks** in the text become the marker highlight; a leading number inside one gets the display face. */

  return esc(text).replace(/\*\*(.+?)\*\*/g, (_, inner) =>

}

/* Staggered reveal for the welcome mosaic. Fixed, scattered order so some tiles land early. */
const MOSAIC_BEATS = [0, 420, 140, 700, 260, 980, 560, 60, 840, 330, 1120, 200, 900, 480, 640, 1040, 280, 760];
function revealMosaic() {
  const start = performance.now();
  document.querySelectorAll(".mosaic img").forEach((img, i) => {
    const beat = MOSAIC_BEATS[i % MOSAIC_BEATS.length];
    const tile = img.parentElement;
    if (i % 3 === 1) tile.classList.add("v");
    const show = () => setTimeout(() => tile.classList.add("in"), Math.max(0, beat - (performance.now() - start)));
    if (img.complete && img.naturalWidth) show();
    else { img.addEventListener("load", show, { once: true }); img.addEventListener("error", () => tile.classList.add("in"), { once: true }); }
  });
}

/* A laurel branch: paired leaves along a curved stem. Mirrored for the right side. */
const BRANCH = (() => {
  const out = [];
  const leaf = (x, y, rot, rx = 2.4, ry = 5.6) => out.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${rx}" ry="${ry}" transform="rotate(${rot.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`);
  const N = 6;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const x = 14 - Math.sin(t * Math.PI * 0.85) * 7, y = 55 - t * 46;
    const tilt = (t - 0.5) * 30;
    leaf(x - 3.6, y - 2.5, -38 + tilt);
    leaf(x + 2.6, y - 3.2, 28 + tilt, 2.1, 5);
  }
  leaf(12.6, 5.5, 8, 2.2, 5);
  const stem = `<path d="M15 58 C 8 46, 6 26, 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>`;
  return stem + `<g fill="currentColor">${out.join("")}</g>`;
})();
const branch = (cls = "") => `<svg class="${cls}" viewBox="0 0 22 60" aria-hidden="true">${BRANCH}</svg>`;
const laurelText = l => `${l.note ? l.note + ", " : ""}${l.event}${l.year ? " " + l.year : ""}`;
function laurelsHTML(list) {
  if (!list || !list.length) return "";
  return `<ul class="laurels" aria-label="Festivals and awards">${list.map(l => {
    const inner = `${branch()}<div>${l.note ? `<small>${esc(l.note)}</small>` : ""}<b>${esc(l.event)}</b>${l.year ? `<span>${l.year}</span>` : ""}</div>${branch("r")}`;
    const href = /^https?:\/\//i.test(l.source || "") ? l.source : "";
    return `<li class="laurel" title="${esc(laurelText(l))}">${href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${inner}</a>` : inner}</li>`;
  }).join("")}</ul>`;
}
const srcLink = u => u.url ? ` <a class="src" href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.source || "Source")} &nearr;</a>` : "";

function renderGrid(n) {
  const start = (n - 1) * SITE.PER_PAGE;
  const items = PROJECTS.slice(start, start + SITE.PER_PAGE);
  const cards = items.map((p, i) => `<a class="card" href="#${p.slug}">

      <span class="meta">${esc(p.format)}</span>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.logline)}</p>
      ${(p.laurels || []).length ? `<span class="accolade">${branch()}<span><b>${esc(p.laurels[0].note || "Official Selection")}</b>, ${esc(p.laurels[0].event)}${p.laurels[0].year ? " " + p.laurels[0].year : ""}${p.laurels.length > 1 ? ` <span>+${p.laurels.length - 1} more</span>` : ""}</span></span>` : ""}
    </a>`).join("");
  const prev = n > 1 ? `#page-${n - 1}` : "#why";
  const next = n < PAGES ? `#page-${n + 1}` : null;
  return `<section class="wrap">
    <div class="page-head">
      <div><h2>projects</h2><span class="range">${pad(start + 1)}&ndash;${pad(start + items.length)} of ${PROJECTS.length}</span></div>
      ${dots(n)}
    </div>
    <div class="grid">${cards}</div>
    <div class="pager">
      <a class="btn" href="${prev}">&larr; ${n > 1 ? "Previous page" : "Why this matters"}</a>
      ${next ? `<a class="btn solid" href="${next}">Next page &rarr;</a>` : `<a class="btn" href="#cover">Back to cover</a>`}
    </div>
  </section>`;
}

  let panel = "";

      : `<p class="note">No public links yet.</p>`;
    const updates = p.updates.length
      ? `<ul class="updates">${p.updates.map(u => `<li><time>${esc(u.date)}</time><div><span>${esc(u.text)}</span>${srcLink(u)}</div></li>`).join("")}</ul>`
      : `<div class="empty">No updates yet. Screenings, press, funding news, and festival selections will appear here as they happen.</div>`;
    panel = `<h4>Links</h4>${links}${p.onRequest ? `<p class="note">${esc(p.onRequest)}.</p>` : ""}<h4>Updates</h4>${updates}`;
  } else {
    // Gallery folder images in name order; older projects show their stills with the key image last.
    const st = p.stills || [];
    const shots = p.gallery ? p.gallery : st.length > 1 ? st.slice(1).concat(st.slice(0, 1)).slice(0, 3) : [];
    const gallery = shots.length
      ? `<h4>Stills</h4><div class="stills${shots.length === 3 ? " three" : shots.length === 1 ? " one" : ""}">${shots.map(([src], i) =>
          `<button type="button" data-full="${esc(src)}" aria-label="Enlarge still ${i + 1}"><img src="${esc(src)}" alt="Still from ${esc(p.title)}" loading="lazy"></button>`).join("")}</div>`
      : "";
    panel = `<div class="prose">${paras(p.summary)}</div>${gallery}
      <h4>Creative team</h4><ul class="team">${p.team.map(([n, r]) => `<li><b>${esc(n)}</b><span>${esc(r)}</span></li>`).join("")}</ul>`;
  }
  const prev = idx > 0 ? PROJECTS[idx - 1] : null;
  const next = idx < PROJECTS.length - 1 ? PROJECTS[idx + 1] : null;
  const pg = pageOf(idx);
  const still = p.hero ? `<img src="${esc(p.hero)}" alt="" style="object-position:${p.focus ?? 50}% ${p.focusY ?? 50}%">` : "";
  return `${still ? `<section class="p-hero">${still}</section>` : ""}
  <div class="wrap">
    <div class="p-head">
      <div class="crumb"><a href="#page-${pg}">&larr; projects, page ${pg}</a></div>
      <p class="label">${esc(p.format)} &middot; ${pad(idx + 1)} of ${PROJECTS.length}</p>
      <h1>${esc(p.title)}</h1>
    </div>
    <article class="project">
      <div style="min-width:0">
        <p class="logline">${esc(p.logline)}</p>
        ${laurelsHTML(p.laurels)}
        ${ups.length && tab !== "links" ? `<div class="latest"><div class="w-label">Latest <time>${esc(ups[0].date)}</time></div><p>${esc(ups[0].text)}${srcLink(ups[0])}</p></div>` : ""}
        <nav class="tabs" aria-label="Project sections">${tabNav}</nav>
        <div class="panel">${panel}</div>
      </div>
      <aside>
        ${p.poster ? `<img class="poster" src="${esc(p.poster)}" alt="Poster for ${esc(p.title)}" loading="lazy">` : ""}
        <dl class="facts">
          <div><dt>Format</dt><dd>${esc(p.format)}</dd></div>
          <div><dt>Status</dt><dd>${esc(p.status)}</dd></div>
          <div><dt>Contact</dt><dd class="copy-row"><code>${esc(p.contact)}</code><button class="btn copy-btn" type="button" data-copy="${esc(p.contact)}">Copy</button></dd></div>
        </dl>
      </aside>
    </article>
    <div class="pager">
      ${prev ? `<a class="btn" href="#${prev.slug}">&larr; ${esc(prev.title)}</a>` : `<span></span>`}
      ${next ? `<a class="btn" href="#${next.slug}">${esc(next.title)} &rarr;</a>` : `<a class="btn" href="#page-${PAGES}">Back to projects</a>`}
    </div>
  </div>`;
}

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const counter = document.getElementById("counter");

function setNav(prev, next, label) {
  [[prevBtn, prev], [nextBtn, next]].forEach(([b, h]) => {
    if (h) { b.href = h; b.removeAttribute("aria-disabled"); } else { b.href = "#"; b.setAttribute("aria-disabled", "true"); }
  });
  counter.textContent = label;
}

/* Visit counting. The website defines window.nfhTrack (GoatCounter); in the Claude version it doesn't
   exist and nothing is counted. A project counts once per visit, not per tab. */
let lastCounted = null;
function countView(path, title) {
  if (path === lastCounted) return;
  lastCounted = path;
  if (window.nfhTrack) window.nfhTrack(path, title);
}

function route() {
  const raw = (location.hash || "#cover").slice(1);
  const [key, tab = ""] = raw.split(".");
  const projIdx = PROJECTS.findIndex(p => p.slug === key);
  if (projIdx > -1) {
    app.innerHTML = renderProject(projIdx, ["help", "links"].includes(tab) ? tab : "");
    setNav(projIdx > 0 ? "#" + PROJECTS[projIdx - 1].slug : null,
           projIdx < PROJECTS.length - 1 ? "#" + PROJECTS[projIdx + 1].slug : null,
           `${pad(projIdx + 1)} / ${PROJECTS.length}`);
    document.title = `${PROJECTS[projIdx].title} · The ${SITE.year} Nonfiction Hotlist`;
    countView("/" + key, PROJECTS[projIdx].title);
  } else {
    let pos = SEQ.indexOf(key);
    if (pos < 0) pos = 0;
    const k = SEQ[pos];
    app.innerHTML = k === "cover" ? renderCover() : k === "welcome" ? renderWelcome() : k === "why" ? renderWhy() : renderGrid(+k.split("-")[1]);
    if (k === "welcome") revealMosaic();
    setNav(pos > 0 ? "#" + SEQ[pos - 1] : null, pos < SEQ.length - 1 ? "#" + SEQ[pos + 1] : null,
           k.startsWith("page-") ? `Page ${k.split("-")[1]} / ${PAGES}` : ({ cover: "Cover", welcome: "Welcome", why: "About" })[k]);
    document.title = `The ${SITE.year} Nonfiction Hotlist`;
    countView(k === "cover" ? "/" : "/" + k, ({ cover: "Cover", welcome: "Welcome", why: "About" })[k] || `Index page ${k.split("-")[1]}`);
  }
  if (!tab) window.scrollTo(0, 0);
}

/* The a to z strip under every page. Titles are sorted ignoring a leading "The", "A" or "An". */
const firstLetter = t => (t.replace(/^(the|a|an)\s+/i, "").match(/[a-z]/i) || ["#"])[0].toLowerCase();
const azFirst = {};
PROJECTS.forEach(p => { const l = firstLetter(p.title); (azFirst[l] = azFirst[l] || []).push(p); });
document.getElementById("azNav").innerHTML = "abcdefghijklmnopqrstuvwxyz".split("").map(l => azFirst[l]
  ? `<a href="#${azFirst[l][0].slug}" data-l="${l}" title="${esc(azFirst[l].map(p => p.title).join(", "))}">${l}</a>`
  : `<span aria-hidden="true">${l}</span>`).join("");
function markLetter() {
  const p = PROJECTS.find(q => q.slug === (location.hash || "").slice(1).split(".")[0]);
  document.querySelectorAll("#azNav a").forEach(a => a.toggleAttribute("aria-current", !!p && a.dataset.l === firstLetter(p.title)));
}
window.addEventListener("hashchange", markLetter);
markLetter();

/* Index drawer */
const panelEl = document.getElementById("indexPanel");
const indexBtn = document.getElementById("indexBtn");
document.getElementById("indexList").innerHTML =
  PROJECTS.map((p, i) => `<li><a href="#${p.slug}"><span class="n">${pad(i + 1)}</span>${esc(p.title)}</a></li>`).join("");
function toggleIndex(open) {
  panelEl.hidden = !open; indexBtn.setAttribute("aria-expanded", String(open));
  if (open) document.getElementById("indexClose").focus();
}
indexBtn.addEventListener("click", () => toggleIndex(panelEl.hidden));
document.getElementById("indexClose").addEventListener("click", () => toggleIndex(false));
panelEl.addEventListener("click", e => { if (e.target === panelEl || e.target.closest("a")) toggleIndex(false); });

/* Copy contact */
app.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const text = b.dataset.copy;
  const done = () => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1600); };
  const fallback = () => {
    const code = b.parentElement.querySelector("code");
    const r = document.createRange(); r.selectNodeContents(code);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    b.textContent = "Selected";
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (_) { fallback(); }
});

/* Stills lightbox */
const lb = document.createElement("div");
lb.className = "lightbox"; lb.hidden = true;
lb.innerHTML = `<img alt=""><button class="btn icon-btn" type="button" aria-label="Close">&times;</button>`;
document.body.appendChild(lb);
lb.addEventListener("click", () => { lb.hidden = true; });
app.addEventListener("click", e => {
  const b = e.target.closest("[data-full]");
  if (!b) return;
  lb.querySelector("img").src = b.dataset.full;
  lb.querySelector("img").alt = b.querySelector("img").alt;
  lb.hidden = false;
});

/* Arrow keys page through the deck */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !lb.hidden) { lb.hidden = true; return; }
  if (e.key === "Escape" && !panelEl.hidden) return toggleIndex(false);
  if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight" && !nextBtn.hasAttribute("aria-disabled")) location.hash = nextBtn.getAttribute("href");
  if (e.key === "ArrowLeft" && !prevBtn.hasAttribute("aria-disabled")) location.hash = prevBtn.getAttribute("href");
});

/* Download PDF: the PDF is built from this same data and published alongside the page. */
const PDF_FILE = "hotlist-" + SITE.year + ".pdf";
let downloads = null, pdfBusy = false;
const toastEl = document.createElement("div");
toastEl.className = "toast"; toastEl.hidden = true; toastEl.setAttribute("role", "status");
document.body.appendChild(toastEl);
function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { toastEl.hidden = true; }, 3200);
}
/* On the public website there is no Claude viewer, so a plain file link does the download. */
const STANDALONE = !(window.claude && window.claude.use);
function showPdfButtons() {
  const on = STANDALONE || !!downloads;
  document.getElementById("pdfBtn").hidden = !on;
  document.querySelectorAll("[data-pdf]").forEach(b => { b.hidden = !on; });
}
function linkDownload() {
  const a = document.createElement("a");
  a.href = PDF_FILE; a.download = `Nonfiction Hotlist ${SITE.year}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
}
async function downloadPdf() {
  if (STANDALONE) return linkDownload();
  if (!downloads || pdfBusy) return;
  pdfBusy = true;
  try {
    const res = await fetch(PDF_FILE);
    if (!res.ok) throw { code: "missing" };
    const blob = await res.blob();
    await downloads.save({ filename: `Nonfiction Hotlist ${SITE.year}.pdf`, data: blob });
  } catch (e) {
    const code = e && e.code;
    if (code === "declined") {}
    else if (code === "rate_limited") toast("A download is already waiting for your OK.");
    else if (code === "missing") toast("The PDF isn't available right now. Try again in a moment.");
    else if (["unavailable", "not_granted", "capability_disabled", "capability_removed", "extension_not_enabled"].includes(code)) {
      toast("Downloads aren't available in this view."); downloads = null; showPdfButtons();
    } else toast("The PDF didn't download. Try again.");
  } finally { pdfBusy = false; }
}
document.addEventListener("click", e => {
  if (!e.target.closest("#pdfBtn, [data-pdf]")) return;
  if (window.nfhTrack) window.nfhTrack("pdf-download", "PDF download", true);
  downloadPdf();
});
showPdfButtons();
(async () => {
  if (STANDALONE) return;
  try { downloads = await window.claude.use("downloads"); } catch (_) { downloads = null; }
  showPdfButtons();
})();

window.addEventListener("hashchange", () => { route(); showPdfButtons(); });
route();
showPdfButtons();
</script>
