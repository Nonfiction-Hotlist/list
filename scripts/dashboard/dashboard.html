<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Team dashboard · Nonfiction Hotlist</title>
<link rel="icon" href="/brand/v1/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/brand/v1/nfh.css">
<style>
/* The site's look (the website's brand kit, /brand/v1/): white ground, a green title band, stat tiles with a
   tracked label and a League Spartan number, 14px corners, lowercase column labels, hairlines between rows. */
:root { --ink: var(--black); --muted: #4d5a50; --line: var(--rule); --card: var(--white); --paper: var(--white);
  --ok: var(--green); --warn: #8a5a00; --warn-line: #fcb100; --bad: #a12b12; }
html { -webkit-text-size-adjust: 100%; }
body { font: 15px/1.5 var(--font-body); }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }
[hidden] { display: none !important; }

/* Header: the green title band */
header { background: var(--gradient-green-text); color: var(--white); }
header .wrap { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding-block: clamp(32px, 4vw, 56px) 28px; flex-wrap: wrap; }
.mark { font: 700 clamp(36px, 4.4vw, 64px)/.92 var(--font-display); letter-spacing: -0.03em; text-transform: lowercase; }
.mark small { display: block; font: 700 14px/18px var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--mint); margin-top: 12px; }
.hlinks { display: flex; gap: 10px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: var(--radius-sm); border: 2px solid var(--white);
  font: 700 15px/1 var(--font-display); text-transform: lowercase; text-decoration: none; color: var(--white); white-space: nowrap; }
.pill:hover { background: var(--white); color: var(--forest); }
.pill.solid { background: var(--white); color: var(--forest); }

/* Year switch: one year at a time. Each year's dashboard is its own page. */
.years { display: flex; align-items: center; gap: 10px; }
.years .lbl { font: 700 14px/18px var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--mint); }
.seg { display: inline-flex; gap: 6px; }
.seg a { display: inline-flex; align-items: baseline; gap: 6px; min-height: 40px; align-items: center; padding: 0 16px; border-radius: var(--radius-pill); border: 1.5px solid var(--white);
  text-decoration: none; font: 700 17px/1 var(--font-display); color: var(--white); }
.seg a small { font: 700 12px/1 var(--font-display); letter-spacing: .08em; text-transform: lowercase; color: var(--mint); }
.seg a:hover { background: rgba(255,255,255,.14); }
.seg a[aria-current="page"] { background: var(--white); color: var(--forest); }
.seg a[aria-current="page"] small { color: var(--forest); }
.draftnote { background: var(--pine-deep); color: var(--white); font-size: 14px; }
.draftnote .wrap { padding-block: 12px; }

/* Stat tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 32px 0 24px; }
.tile { background: var(--white); border: 1px solid var(--rule); border-radius: var(--radius-md); padding: 18px 20px; min-height: 110px; }
.tile .k { font: 700 14px/18px var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); }
.tile .v { font: 700 44px/1 var(--font-display); letter-spacing: -0.02em; margin-top: 10px; font-variant-numeric: tabular-nums; }
.tile .s { color: var(--muted); font-size: 13px; line-height: 19px; margin-top: 6px; }
.tile.hero { background: var(--gradient-green-text); border-color: transparent; color: var(--white); }
.tile.hero .k, .tile.hero .s { color: var(--mint); }
.tile .v.small { font-size: 22px; line-height: 1.15; letter-spacing: -0.01em; }
.tile.warn { border: 2px solid var(--warn-line); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: 2px; }
.dot.warn { background: var(--warn-line); } .dot.bad { background: var(--bad); }

/* Front page links */
.quick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 32px; }
.quick .lbl { font: 700 14px/18px var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); margin-right: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 16px; border-radius: var(--radius-pill); border: 1.5px solid var(--forest); color: var(--forest);
  text-decoration: none; font: 700 15px/1 var(--font-display); text-transform: lowercase; }
.chip:hover { background: var(--forest); color: var(--white); }
.ico { width: 14px; height: 14px; flex: none; }

/* Projects */
.bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
h2 { font: 700 clamp(30px, 3vw, 44px)/.95 var(--font-display); letter-spacing: -0.02em; text-transform: lowercase; color: var(--forest); margin: 0; }
.tools { display: flex; gap: 8px; align-items: center; }
input[type=search], select { font: 15px var(--font-body); min-height: 44px; padding: 0 16px; border: 1px solid var(--rule); border-radius: var(--radius-pill); background: var(--paper, #f2f2f2); background: #f2f2f2; color: var(--black); }
input[type=search] { width: 240px; }
input[type=search]:focus, select:focus { outline: 3px solid var(--forest); outline-offset: 2px; }
.table { background: var(--white); }
.row { display: grid; grid-template-columns: 34px 72px minmax(0, 1fr) 150px 70px auto; gap: 14px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--rule); }
.row:first-child { border-top: 0; }
.row.head { font: 700 14px/18px var(--font-display); letter-spacing: .06em; text-transform: lowercase; color: var(--forest); padding-block: 10px; }
.n { font: 700 13px/1 var(--font-display); letter-spacing: .12em; color: var(--forest); font-variant-numeric: tabular-nums; }
.thumb { width: 72px; height: 48px; border-radius: 6px; object-fit: cover; background: var(--gradient-forest); display: block; }
.ttl a { font: italic 600 17px/1.25 var(--font-body); text-decoration: none; color: var(--black); }
.ttl a:hover { color: var(--forest); text-decoration: underline; text-underline-offset: 3px; }
.ttl small { display: block; color: var(--muted); font-size: 13px; }
.ttl .flag { color: var(--bad); font-size: 13px; }
.meter { display: flex; align-items: center; gap: 8px; }
.meter i { flex: 1; height: 8px; border-radius: 4px; background: #e6ece6; overflow: hidden; position: relative; }
.meter i b { position: absolute; inset: 0 auto 0 0; background: var(--green); border-radius: 4px; }
.meter i b.warn { background: var(--warn-line); }
.meter span { font: 700 13px/1 var(--font-display); font-variant-numeric: tabular-nums; width: 38px; text-align: right; }
.missing { font-size: 12px; color: var(--warn); margin-top: 4px; }
.vis { font: 700 20px/1 var(--font-display); font-variant-numeric: tabular-nums; text-align: right; }
.vis.none { color: var(--muted); font-size: 14px; }
.acts { display: flex; gap: 6px; justify-content: flex-end; }
.act { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--forest); color: var(--forest);
  text-decoration: none; font: 700 14px/1 var(--font-display); text-transform: lowercase; white-space: nowrap; background: var(--white); }
.act:hover { background: var(--forest); color: var(--white); }
.act.primary { background: var(--forest); color: var(--white); }
.act.primary:hover { background: var(--pine-deep); border-color: var(--pine-deep); }
.empty { padding: 24px; text-align: center; color: var(--muted); }

/* Expandable sections */
.sections { margin: 40px 0 10px; display: grid; gap: 12px; }
details { background: var(--white); border: 1px solid var(--rule); border-radius: var(--radius-md); }
summary { list-style: none; cursor: pointer; min-height: 56px; padding: 14px 20px; display: flex; align-items: center; gap: 12px; font: 700 20px/1.1 var(--font-display); text-transform: lowercase; letter-spacing: -0.01em; }
summary::-webkit-details-marker { display: none; }
summary::after { content: ""; width: 9px; height: 9px; border-right: 2.4px solid var(--forest); border-bottom: 2.4px solid var(--forest); transform: rotate(45deg); margin-left: auto; transition: transform .2s; }
details[open] summary::after { transform: rotate(225deg); }
summary .sub { font: 400 14px var(--font-body); text-transform: none; letter-spacing: 0; color: var(--muted); }
.badge { font: 700 12px/1 var(--font-display); padding: 5px 10px; border-radius: var(--radius-pill); background: var(--forest); color: var(--white); text-transform: lowercase; }
.badge.warn { background: var(--warn-line); color: var(--black); }
.badge.bad { background: var(--bad); color: var(--white); }
.badge.ok { background: var(--green); color: var(--white); }
.body { padding: 0 20px 20px; }
.body p { margin: 0 0 12px; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 10px 0; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 14px; }
.list li:first-child { border-top: 0; }
.list.rest li:first-child { border-top: 1px solid var(--rule); }
.list .when { font: 700 13px/22px var(--font-display); letter-spacing: .04em; color: var(--forest); font-variant-numeric: tabular-nums; }
.list .what b { font-weight: 600; }
.list .what span { color: var(--muted); }
.src { font: 700 12px/1 var(--font-display); color: var(--forest); border: 1px solid var(--forest); border-radius: var(--radius-pill); padding: 3px 8px; margin-left: 6px; text-transform: lowercase; }
.more { margin-top: 8px; font: 700 15px var(--font-display); text-transform: lowercase; background: none; border: 0; padding: 8px 0; color: var(--forest); cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
.problem { padding: 10px 14px; border-radius: var(--radius-sm); border-left: 3px solid var(--warn-line); background: var(--white); margin-bottom: 8px; font-size: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.two h3 { font: 700 14px/18px var(--font-display); letter-spacing: .12em; text-transform: lowercase; color: var(--forest); margin: 4px 0 10px; }
.bars li { display: grid; grid-template-columns: minmax(0, 1fr) 50px; gap: 10px; padding: 7px 0; border-top: 1px solid var(--rule); position: relative; }
.bars li:first-child { border-top: 0; }
.bars .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; padding-left: 8px; }
.bars .nm em { position: relative; font-style: normal; }
.bars .fill { position: absolute; left: 0; top: 4px; bottom: 4px; background: rgba(88, 130, 87, .22); border-radius: 4px; }
.bars .ct { text-align: right; font: 700 15px var(--font-display); font-variant-numeric: tabular-nums; }
.mono { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: #f2f2f2; padding: 1px 6px; border-radius: 4px; }
ol.steps { margin: 6px 0 0; padding-left: 20px; } ol.steps li { margin-bottom: 4px; }

footer { color: var(--muted); font-size: 13px; padding: 28px 0 56px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
footer label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; min-height: 44px; }

@media (max-width: 860px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row { grid-template-columns: 56px minmax(0, 1fr) auto; grid-template-areas: "thumb title vis" "thumb meter meter" "acts acts acts"; row-gap: 8px; }
  .row.head { display: none; }
  .row .n { display: none; }
  .row .thumb { grid-area: thumb; width: 56px; height: 38px; align-self: start; }
  .row .ttl { grid-area: title; } .row .meter-cell { grid-area: meter; } .row .vis { grid-area: vis; } .row .acts { grid-area: acts; justify-content: flex-start; }
  .two { grid-template-columns: 1fr; }
  .list li { grid-template-columns: 1fr; gap: 2px; }
  input[type=search] { width: 100%; }
  .tools { width: 100%; }
}
@media (max-width: 420px) { .tile .v { font-size: 32px; } .act { padding: 0 10px; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="mark"><span id="yr"></span> hotlist<small>team dashboard · nonfiction hotlist.</small></div>
    <nav class="years" aria-label="Year"><span class="lbl">Year</span><span class="seg" id="years"></span></nav>
    <nav class="hlinks">
      <a class="pill" id="driveLink" target="_blank" rel="noopener">Drive folder</a>
      <a class="pill solid" id="siteLink" target="_blank" rel="noopener">Open site</a>
    </nav>
  </div>
</header>
<div class="draftnote" id="draftNote" hidden><div class="wrap"></div></div>

<main class="wrap">
  <section class="tiles" id="tiles"></section>
  <nav class="quick" id="quick" aria-label="Front pages"></nav>

  <div class="bar">
    <h2>Projects</h2>
    <div class="tools">
      <input type="search" id="q" placeholder="Find a project" aria-label="Find a project">
      <select id="sort" aria-label="Sort projects">
        <option value="order">Site order</option>
        <option value="visits">Most visited</option>
        <option value="complete">Least complete</option>
        <option value="title">A to Z</option>
      </select>
    </div>
  </div>
  <div class="table" id="projects" role="table" aria-label="Projects"></div>

  <div class="sections" id="sections"></div>

  <footer>
    <span id="updated"></span>
    <label><input type="checkbox" id="skip"> Don't count my visits to the site from this browser</label>
  </footer>
</main>

<script>
const D = /*__DATA__*/null;

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = n => n == null ? "–" : Number(n).toLocaleString();
const ICON = {
  sheet: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="1.5" width="11" height="13" rx="1.5"/><path d="M2.5 6h11M2.5 10h11M7 6v8.5"/></svg>',
  folder: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 4.5a1 1 0 0 1 1-1h3.6l1.4 1.6h6a1 1 0 0 1 1 1v6.4a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg>',
  doc: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M9.5 1.5v3h3M5.5 8h5M5.5 10.5h5"/></svg>',
  ext: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 2.5h4.5V7M13.5 2.5 7 9M11.5 9.5v4h-9v-9h4"/></svg>'
};

function ago(iso) {
  if (!iso) return "never";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " hr ago";
  const d = Math.round(s / 86400);
  return d === 1 ? "yesterday" : d < 30 ? d + " days ago" : new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
const when = iso => new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

/* Header and tiles */
document.getElementById("yr").textContent = D.year;
document.title = `${D.year} · Team dashboard · Nonfiction Hotlist`;
document.getElementById("years").innerHTML = D.years.map(y =>
  `<a href="${esc(y.url)}"${y.year === D.year ? ' aria-current="page"' : ""}>${esc(y.year)}<small>${y.status === "live" ? "live" : "draft"}</small></a>`).join("");
if (D.status !== "live") {
  const n = document.getElementById("draftNote");
  n.firstElementChild.textContent = `${D.year} is a draft: the team can see its site, but it isn't linked from the front door or listed in search, and visits aren't counted.`;
  n.hidden = false;
}
// /dashboard/ opens the year viewed last.
try { localStorage.setItem("nfhDashYear", D.year); } catch (e) {}
document.getElementById("driveLink").href = D.driveRoot;
document.getElementById("siteLink").href = D.siteUrl;

const S = D.stats, statsOn = S && !S.error;
const problems = D.sync.problems;
const brokenCount = D.links ? (D.links.broken || []).length : 0;
const avgComplete = Math.round(D.projects.reduce((a, p) => a + p.complete, 0) / D.projects.length);

document.getElementById("tiles").innerHTML = [
  `<div class="tile hero"><div class="k">PDF downloads</div><div class="v">${statsOn ? fmt(S.pdf) : "–"}</div><div class="s">${statsOn ? "since Oct 24" : "connect counting below"}</div></div>`,
  `<div class="tile"><div class="k">Site visits</div><div class="v">${statsOn ? fmt(S.total) : "–"}</div><div class="s">${statsOn ? "page views since Oct 24" : "not connected yet"}</div></div>`,
  `<div class="tile${problems.length ? " warn" : ""}"><div class="k">Sync</div><div class="v small"><span class="dot${problems.length ? " warn" : ""}"></span>${problems.length ? `${problems.length} edit${problems.length > 1 ? "s" : ""} skipped` : "All edits live"}</div><div class="s">Checked ${ago(D.generatedAt)}${D.sync.lastDriveChange ? ` · last change ${ago(D.sync.lastDriveChange)}` : ""}</div></div>`,
  `<div class="tile"><div class="k">Complete</div><div class="v">${avgComplete}%</div><div class="s">${D.projects.filter(p => p.complete === 100).length} of ${D.projects.length} projects at 100%</div></div>`
].join("");

document.getElementById("quick").innerHTML = `<span class="lbl">Front pages</span>` + D.front.map(f =>
  `<a class="chip" href="${esc(f.url)}" target="_blank" rel="noopener">${f.url.includes("/folders/") ? ICON.folder : f.url.includes("spreadsheets") ? ICON.sheet : ICON.doc}${esc(f.label)}</a>`).join("");

/* Projects table */
const q = document.getElementById("q"), sortSel = document.getElementById("sort");
try { const s = localStorage.getItem("dash-sort"); if (s) sortSel.value = s; } catch (e) {}
if (!statsOn) sortSel.querySelector('[value="visits"]').disabled = true;

function renderProjects() {
  const term = q.value.trim().toLowerCase();
  let list = D.projects.filter(p => !term || p.title.toLowerCase().includes(term));
  const by = sortSel.value;
  if (by === "visits") list = [...list].sort((a, b) => (b.visits || 0) - (a.visits || 0));
  if (by === "complete") list = [...list].sort((a, b) => a.complete - b.complete || a.n - b.n);
  if (by === "title") list = [...list].sort((a, b) => a.title.localeCompare(b.title));
  const head = `<div class="row head" role="row"><span>#</span><span></span><span>Project</span><span>Complete</span><span style="text-align:right">Visits</span><span style="text-align:right">Edit</span></div>`;
  const rows = list.map(p => `<div class="row" role="row">
    <span class="n">${String(p.n).padStart(2, "0")}</span>
    ${p.key ? `<img class="thumb" src="${esc(p.key)}" alt="" loading="lazy">` : `<span class="thumb"></span>`}
    <div class="ttl"><a href="${esc(p.live)}" target="_blank" rel="noopener">${esc(p.title)}</a><small>${esc(p.format)}${p.broken ? ` · <span class="flag">${p.broken} broken link${p.broken > 1 ? "s" : ""}</span>` : ""}</small></div>
    <div class="meter-cell"><div class="meter" title="${p.missing.length ? "Missing: " + esc(p.missing.join(", ")) : "Everything filled in"}"><i><b class="${p.complete < 100 ? "warn" : ""}" style="width:${p.complete}%"></b></i><span>${p.complete}%</span></div>${p.missing.length ? `<div class="missing">Missing: ${esc(p.missing.join(", "))}</div>` : ""}</div>
    <div class="vis${p.visits == null ? " none" : ""}">${p.visits == null ? "–" : fmt(p.visits)}</div>
    <div class="acts">
      ${p.sheet ? `<a class="act primary" href="${esc(p.sheet)}" target="_blank" rel="noopener">${ICON.sheet}Copysheet</a>` : ""}
      ${p.media ? `<a class="act" href="${esc(p.media)}" target="_blank" rel="noopener">${ICON.folder}Media</a>` : ""}
    </div>
  </div>`).join("");
  document.getElementById("projects").innerHTML = head + (rows || `<div class="empty">No project matches "${esc(q.value)}".</div>`);
}
q.addEventListener("input", renderProjects);
sortSel.addEventListener("change", () => { try { localStorage.setItem("dash-sort", sortSel.value); } catch (e) {} renderProjects(); });
renderProjects();

/* Expandable sections */
function section(id, title, sub, badge, body, open) {
  return `<details id="${id}"${open ? " open" : ""}><summary>${title}${badge || ""}<span class="sub">${sub || ""}</span></summary><div class="body">${body}</div></details>`;
}
function capped(items, n, render) {
  const first = items.slice(0, n).map(render).join(""), rest = items.slice(n).map(render).join("");
  return `<ul class="list">${first}</ul>${rest ? `<ul class="list rest" hidden>${rest}</ul><button class="more" type="button" data-more>Show ${items.length - n} more</button>` : ""}`;
}

const out = [];

// 1. Sync health
out.push(section("sync", "Sync health",
  problems.length ? "These edits didn't publish. The site kept the previous text." : "Every edit in Drive is on the site.",
  problems.length ? ` <span class="badge warn">${problems.length}</span>` : ` <span class="badge ok">OK</span>`,
  (problems.length ? problems.map(p => `<div class="problem">${esc(p)}</div>`).join("") + `<p style="margin-top:10px">Fix these in Drive. They publish on the next check.</p>` : "") +
  `<p>Last check of Drive: ${when(D.generatedAt)}.${D.sync.lastDriveChange ? ` Last change from Drive: ${when(D.sync.lastDriveChange)}.` : ""}</p>
   <p><a href="${esc(D.publishUrl)}" target="_blank" rel="noopener">Publish now</a> (site owner: Run workflow on GitHub).</p>`,
  problems.length > 0));

// 2. Recent changes
const changeRows = [];
for (const c of D.changes) for (const it of c.items) changeRows.push({ date: c.date, fromDrive: c.fromDrive, ...it });
out.push(section("changes", "Recent changes", changeRows.length ? `Latest: ${esc(changeRows[0].what)}, ${ago(changeRows[0].date)}` : "",
  ` <span class="badge">${changeRows.length}</span>`,
  changeRows.length ? capped(changeRows, 6, r => `<li><span class="when">${when(r.date)}</span><span class="what"><b>${esc(r.what)}</b> <span>${esc(r.detail)}</span>${r.fromDrive ? "" : `<span class="src">site</span>`}</span></li>`)
    : `<p>No changes yet.</p>`));

// 3. Link check
const L = D.links;
out.push(section("links", "Broken links",
  L ? `Checked ${ago(L.checkedAt)} · ${fmt(L.total)} links` : "Runs once a day",
  L ? (brokenCount ? ` <span class="badge bad">${brokenCount}</span>` : ` <span class="badge ok">None</span>`) : "",
  !L ? `<p>The first daily check hasn't run yet.</p>` :
  (brokenCount ? capped(L.broken, 8, b => `<li><span class="when">${b.status ? "HTTP " + b.status : esc(b.error || "No response")}</span><span class="what"><b>${esc(b.where.map(w => w.title).join(", "))}</b> <span>${esc(b.where.map(w => w.field).join(", "))}</span><br><a class="mono" href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.url)}</a></span></li>`)
    : `<p>No missing pages found.</p>`) +
  (L.unchecked && L.unchecked.length ? `<p style="margin-top:10px">${L.unchecked.length} link${L.unchecked.length > 1 ? "s" : ""} couldn't be checked automatically because the site turns away automated visits (social media, some news sites). Those usually work fine in a browser.</p>` : "")));

// 4. Where visitors come from
let trafficBody;
if (!S) {
  trafficBody = `<p>Visit counting is on, but the dashboard needs a read key to show the numbers:</p>
    <ol class="steps"><li>In GoatCounter, open Settings, then API, and create a key with permission to read statistics.</li>
    <li>In GitHub, open the repo's Settings, then Secrets and variables, then Actions, and add a secret named <code>GOATCOUNTER_TOKEN</code> with that key.</li></ol>
    <p style="margin-top:8px">Numbers appear here after the next refresh.</p>`;
} else if (S.error) {
  trafficBody = `<p>GoatCounter didn't answer the last check (${esc(S.error)}). Numbers will return on the next one.</p>`;
} else {
  const bars = (rows, label) => {
    const max = Math.max(1, ...rows.map(r => r.count));
    return rows.length ? `<ul class="list bars">${rows.map(r => `<li><span class="nm"><span class="fill" style="width:${(r.count / max) * 100}%"></span><em>${esc(label(r))}</em></span><span class="ct">${fmt(r.count)}</span></li>`).join("")}</ul>` : `<p>Nothing yet.</p>`;
  };
  trafficBody = `<div class="two"><div><h3>Sources</h3>${bars(S.refs, r => r.name)}</div><div><h3>Most viewed</h3>${bars(S.pages, r => r.title || r.path)}</div></div>
    <p style="margin-top:12px"><a href="${esc(D.gc)}" target="_blank" rel="noopener">Full stats in GoatCounter</a></p>`;
}
out.push(section("traffic", "Where visitors come from", statsOn && S.refs.length ? `Top source: ${esc(S.refs[0].name)}` : "", "", trafficBody));

document.getElementById("sections").innerHTML = out.join("");
document.getElementById("sections").addEventListener("click", e => {
  const b = e.target.closest("[data-more]"); if (!b) return;
  const rest = b.previousElementSibling;
  rest.hidden = !rest.hidden;
  b.textContent = rest.hidden ? `Show ${rest.children.length} more` : "Show fewer";
});
// Remember which sections are open.
document.querySelectorAll("details").forEach(d => {
  try { const v = localStorage.getItem("dash-open-" + d.id); if (v !== null) d.open = v === "1"; } catch (e) {}
  d.addEventListener("toggle", () => { try { localStorage.setItem("dash-open-" + d.id, d.open ? "1" : "0"); } catch (e) {} });
});
if (problems.length) document.getElementById("sync").open = true;

/* Footer */
document.getElementById("updated").textContent = `Updated ${when(D.generatedAt)}.`;
const skip = document.getElementById("skip");
try { skip.checked = localStorage.getItem("skipgc") === "t"; } catch (e) { skip.disabled = true; }
skip.addEventListener("change", () => { try { skip.checked ? localStorage.setItem("skipgc", "t") : localStorage.removeItem("skipgc"); } catch (e) {} });
</script>
</body>
</html>
